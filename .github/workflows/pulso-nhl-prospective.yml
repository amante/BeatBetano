name: PULSO NHL — prospective pregame source capture
on:
  pull_request:
    paths:
      - 'nhl/match_context.py'
      - 'nhl/goalie_ml_inference.py'
      - 'nhl/sporting_packages.py'
      - 'nhl/special_teams_capture.py'
      - 'nhl/schedule_context.py'
      - 'nhl/skater_history.py'
      - 'nhl/prior_lineup_reference.py'
      - 'nhl/lineup_changes.py'
      - 'nhl/lineup_features.py'
      - 'nhl/absence_exposure.py'
      - 'nhl/minute_adjusted_ml.py'
      - 'nhl/joint_goal_model.py'
      - 'nhl/joint_match_input_builder_321.py'
      - 'nhl/joint_match_engine_320.py'
      - 'frontend/nhl-joint-model.js'
      - 'nhl/tests/test_joint_match_input_builder_321.py'
      - 'nhl/tests/test_joint_goal_model.py'
      - 'nhl/tests/test_minute_adjusted_ml.py'
      - 'nhl/tests/test_absence_exposure.py'
      - 'nhl/freeze_lineup_dataset.py'
      - 'nhl/tests/test_freeze_lineup_dataset.py'
      - 'nhl/tests/test_lineup_features.py'
      - 'nhl/tests/test_lineup_changes.py'
      - 'nhl/tests/test_prior_lineup_reference.py'
      - 'nhl/tests/test_skater_history.py'
      - 'nhl/tests/test_schedule_context.py'
      - 'nhl/pulso_live_sporting_246.py'
      - 'nhl/tests/test_special_teams_capture.py'
      - 'nhl/pulso_sporting_bridge_226.py'
      - 'nhl/pulso_sporting_core_245.py'
      - 'nhl/tests/test_sporting_connections.py'
      - 'nhl/pulso_goalie_scenarios_258.py'
      - 'nhl/tests/test_all_goalie_pairings.py'
      - 'nhl/models/**'
      - 'nhl/goalie_prospective_evaluation.py'
      - 'nhl/pulso_research_presentation_275.py'
      - 'nhl/tests/test_goalie_ml_inference.py'
      - 'nhl/pulso_prospective_capture.py'
      - 'nhl/tests/test_player_evidence.py'
      - '.github/workflows/pulso-nhl-prospective.yml'
  workflow_dispatch:
    inputs:
      day:
        description: 'UTC/NHL schedule day (YYYY-MM-DD); leave blank for current UTC date'
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: pulso-nhl-source-capture
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m unittest nhl.tests.test_joint_match_input_builder_321 nhl.tests.test_freeze_lineup_dataset nhl.tests.test_lineup_features nhl.tests.test_lineup_changes nhl.tests.test_prior_lineup_reference nhl.tests.test_skater_history nhl.tests.test_pulso_live_sporting_246 nhl.tests.test_pulso_sporting_core_245 nhl.tests.test_schedule_context nhl.tests.test_special_teams_capture nhl.tests.test_sporting_connections nhl.tests.test_all_goalie_pairings nhl.tests.test_goalie_ml_inference nhl.tests.test_player_evidence nhl.tests.test_match_context nhl.tests.test_pulso_prospective_capture nhl.tests.test_pulso_209 nhl.tests.test_pulso_outcome_forecast_218 nhl.tests.test_pulso_goalie_integration_254 nhl.tests.test_pulso_goalie_states_255 nhl.tests.test_pulso_goalie_multisource_257 nhl.tests.test_pulso_goalie_scenarios_258 nhl.tests.test_pulso_goalie_conditioned_259 nhl.tests.test_pulso_goalie_candidates_260 nhl.tests.test_pulso_goalie_training_263 nhl.tests.test_pulso_historical_goalie_join_264 nhl.tests.test_pulso_historical_boxscores_265 nhl.tests.test_pulso_boxscore_schema_audit_266 nhl.tests.test_pulso_historical_features_267 nhl.tests.test_pulso_historical_sequential_268 nhl.tests.test_pulso_goalie_model_269 nhl.tests.test_pulso_goalie_ablation_270 nhl.tests.test_pulso_ml_decision_271 nhl.tests.test_pulso_ml_strong_baseline_272 nhl.tests.test_pulso_pregame_publication_273 nhl.tests.test_pulso_daily_slate_274 nhl.tests.test_pulso_research_presentation_275 nhl.tests.test_pulso_prospective_monitor_276 -v
  capture:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Capture current NHL source evidence
        env:
          REQUESTED_DAY: ${{ inputs.day }}
        run: |
          DAY="${REQUESTED_DAY:-$(date -u +%F)}"
          python -m nhl.pulso_prospective_capture --date "$DAY" --output-dir "results/pulso/nhl/$DAY" --public-status frontend/data/pulso-nhl-research.json
      - name: Audit fixture-attested player and goalie identities
        run: |
          DAY="${{ inputs.day }}"
          DAY="${DAY:-$(date -u +%F)}"
          python -m unittest nhl.tests.test_pulso_fixture_identity_248 -v
          python -m nhl.pulso_fixture_identity_248 \
            --report "results/pulso/nhl/$DAY/report.json" \
            --rosters "results/pulso/nhl/$DAY/official_roster_candidates.json" \
            --goalies "results/pulso/nhl/$DAY/goalie_identity_crosswalk.json" \
            --editorial "results/pulso/nhl/$DAY/editorial_lineup_observations.json" \
            --out "results/pulso/nhl/$DAY/fixture_identity_248.json"
      - name: Cross-check external named goalie statuses
        run: |
          python -m unittest nhl.tests.test_pulso_goalie_multisource_257 -v
          DAY="${{ inputs.day }}"
          DAY="${DAY:-$(date -u +%F)}"
          python -m nhl.pulso_goalie_multisource_257 \
            --report "results/pulso/nhl/$DAY/report.json" \
            --rosters "results/pulso/nhl/$DAY/official_roster_candidates.json" \
            --out "results/pulso/nhl/$DAY/external_goalie_observations_257.json"
      - name: Classify goalie certainty without artificial PASS
        run: |
          python -m unittest nhl.tests.test_pulso_goalie_states_255 nhl.tests.test_pulso_goalie_multisource_257 -v
          DAY="${{ inputs.day }}"
          DAY="${DAY:-$(date -u +%F)}"
          python -m nhl.pulso_goalie_states_255 \
            --report "results/pulso/nhl/$DAY/report.json" \
            --identity "results/pulso/nhl/$DAY/fixture_identity_248.json" \
            --external "results/pulso/nhl/$DAY/external_goalie_observations_257.json" \
            --out "results/pulso/nhl/$DAY/goalie_states_255.json"
      - name: Prepare goalie-conditional scenario matrix
        run: |
          python -m unittest nhl.tests.test_pulso_goalie_scenarios_258 -v
          DAY="${{ inputs.day }}"
          DAY="${DAY:-$(date -u +%F)}"
          python -m nhl.pulso_goalie_scenarios_258 \
            --report "results/pulso/nhl/$DAY/report.json" \
            --identity "results/pulso/nhl/$DAY/fixture_identity_248.json" \
            --external "results/pulso/nhl/$DAY/external_goalie_observations_257.json" \
            --rosters "results/pulso/nhl/$DAY/official_roster_candidates.json" \
            --editorial-raw "results/pulso/nhl/$DAY/editorial_lineup_raw.html" \
            --out "results/pulso/nhl/$DAY/goalie_scenarios_258.json"
      - name: Integrate goalie-conditioned predictions with strict validation gate
        run: |
          python -m unittest nhl.tests.test_pulso_goalie_conditioned_259 -v
          DAY="${{ inputs.day }}"
          DAY="${DAY:-$(date -u +%F)}"
          python -m nhl.pulso_goalie_conditioned_259 \
            --scenarios "results/pulso/nhl/$DAY/goalie_scenarios_258.json" \
            --out "results/pulso/nhl/$DAY/goalie_conditioned_259.json"
      - name: Capture individual candidate goalie history before puck drop
        run: |
          python -m unittest nhl.tests.test_pulso_goalie_history_251 -v
          DAY="${{ inputs.day }}"
          DAY="${DAY:-$(date -u +%F)}"
          python -m nhl.pulso_goalie_history_251 \
            --report "results/pulso/nhl/$DAY/report.json" \
            --identity "results/pulso/nhl/$DAY/fixture_identity_248.json" \
            --out "results/pulso/nhl/$DAY/goalie_history_251.json"
      - name: Capture every candidate goalie history
        run: |
          python -m unittest nhl.tests.test_pulso_goalie_candidates_260 -v
          DAY="${{ inputs.day }}"
          DAY="${DAY:-$(date -u +%F)}"
          python -m nhl.pulso_goalie_candidates_260 --scenarios "results/pulso/nhl/$DAY/goalie_scenarios_258.json" --report "results/pulso/nhl/$DAY/report.json" --out "results/pulso/nhl/$DAY/all_goalie_candidates_260.json"
      - name: Compute non-calibrated goalie performance indicators
        run: |
          python -m unittest nhl.tests.test_pulso_goalie_daily_253 -v
          DAY="${{ inputs.day }}"
          DAY="${DAY:-$(date -u +%F)}"
          python -m nhl.pulso_goalie_daily_253 \
            --history "results/pulso/nhl/$DAY/goalie_history_251.json" \
            --out "results/pulso/nhl/$DAY/goalie_daily_253.json"
      - name: Publish readable goalie-by-team report
        run: |
          DAY="${{ inputs.day }}"
          DAY="${DAY:-$(date -u +%F)}"
          python -m nhl.pulso_goalie_display_256 \
            --identity "results/pulso/nhl/$DAY/fixture_identity_248.json" \
            --daily "results/pulso/nhl/$DAY/goalie_daily_253.json" \
            --out "results/pulso/nhl/$DAY/goalie_names_256.txt"
      - name: Capture official NHL prior-day team form and observed PP/PK
        run: |
          DAY="${{ inputs.day }}"
          DAY="${DAY:-$(date -u +%F)}"
          python -m nhl.pulso_live_sporting_246 \
            --report "results/pulso/nhl/$DAY/report.json" \
            --out "results/pulso/nhl/$DAY/live_sporting_246.json"
      - name: Capture official schedule gaps, B2B and venue context
        env:
          REQUESTED_DAY: ${{ inputs.day }}
        run: |
          DAY="${REQUESTED_DAY:-$(date -u +%F)}"
          python -m nhl.schedule_context \
            --report "results/pulso/nhl/$DAY/report.json" \
            --output "results/pulso/nhl/$DAY/schedule_context.json"
      - name: Capture official dated PP and PK counts
        env:
          REQUESTED_DAY: ${{ inputs.day }}
        run: |
          DAY="${REQUESTED_DAY:-$(date -u +%F)}"
          python -m nhl.special_teams_capture \
            --report "results/pulso/nhl/$DAY/report.json" \
            --output "results/pulso/nhl/$DAY/special_teams_counts.json"
      - name: Establish analysis cutoff after sporting source retrieval
        run: python -c 'from datetime import datetime,timezone; print("SPORTING_ANALYSIS_AS_OF="+datetime.now(timezone.utc).isoformat())' >> "$GITHUB_ENV"
      - name: Normalize observed NHL sporting source evidence
        run: |
          DAY="${{ inputs.day }}"
          DAY="${DAY:-$(date -u +%F)}"
          python -m nhl.pulso_sporting_bridge_226 \
            --report "results/pulso/nhl/$DAY/report.json" \
            --crosswalk "results/pulso/nhl/$DAY/goalie_identity_crosswalk.json" \
            --rosters "results/pulso/nhl/$DAY/official_roster_candidates.json" \
            --analysis-as-of "$SPORTING_ANALYSIS_AS_OF" \
            --out "results/pulso/nhl/$DAY/sporting_bridge.json"
      - name: Produce gated quantitative sporting research vector
        run: |
          DAY="${{ inputs.day }}"
          DAY="${DAY:-$(date -u +%F)}"
          mkdir -p "results/pulso/nhl/$DAY"
          python -m nhl.sporting_packages \
            --report "results/pulso/nhl/$DAY/report.json" \
            --crosswalk "results/pulso/nhl/$DAY/goalie_identity_crosswalk.json" \
            --history "results/pulso/nhl/$DAY/goalie_history_251.json" \
            --rosters "results/pulso/nhl/$DAY/official_roster_candidates.json" \
            --analysis-as-of "$SPORTING_ANALYSIS_AS_OF" \
            --special-teams "results/pulso/nhl/$DAY/special_teams_counts.json" \
            --output "results/pulso/nhl/$DAY/verified_sporting_packages.json"
          python -m nhl.pulso_quantitative_signals_227 \
            --bridge "results/pulso/nhl/$DAY/sporting_bridge.json" \
            --packages "results/pulso/nhl/$DAY/verified_sporting_packages.json" \
            --out "results/pulso/nhl/$DAY/quantitative_signals.json"
      - name: Capture actual previous-game participants as historical reference
        run: |
          DAY="${{ inputs.day }}"
          DAY="${DAY:-$(date -u +%F)}"
          python -m nhl.prior_lineup_reference --context "results/pulso/nhl/$DAY/schedule_context.json" --output "results/pulso/nhl/$DAY/prior_lineup_reference.json"
      - name: Capture prior-day individual skater history and TOI
        run: |
          DAY="${{ inputs.day }}"
          DAY="${DAY:-$(date -u +%F)}"
          python -m nhl.skater_history --report "results/pulso/nhl/$DAY/report.json" --rosters "results/pulso/nhl/$DAY/official_roster_candidates.json" --reference "results/pulso/nhl/$DAY/prior_lineup_reference.json" --output "results/pulso/nhl/$DAY/skater_history.json"
      - name: Preserve fixture-level individual player and goalie evidence
        run: |
          DAY="${{ inputs.day }}"
          DAY="${DAY:-$(date -u +%F)}"
          echo '{}' > "results/pulso/nhl/$DAY/verified_lineup_history_packages.json"
          python -m nhl.pulso_individual_evidence_247 \
            --report "results/pulso/nhl/$DAY/report.json" \
            --packages "results/pulso/nhl/$DAY/verified_lineup_history_packages.json" \
            --out "results/pulso/nhl/$DAY/individual_evidence_247.json"
      - name: Audit real fixture-level sporting source coverage
        run: |
          python -m unittest nhl.tests.test_pulso_source_coverage_249 nhl.tests.test_pulso_goalie_integration_254 -v
          DAY="${{ inputs.day }}"
          DAY="${DAY:-$(date -u +%F)}"
          python -m nhl.pulso_source_coverage_249 \
            --report "results/pulso/nhl/$DAY/report.json" \
            --identity "results/pulso/nhl/$DAY/fixture_identity_248.json" \
            --individual "results/pulso/nhl/$DAY/individual_evidence_247.json" \
            --team-form "results/pulso/nhl/$DAY/live_sporting_246.json" \
            --goalie-daily "results/pulso/nhl/$DAY/goalie_daily_253.json" \
            --out "results/pulso/nhl/$DAY/source_coverage_249.json"
      - name: Execute original NHL sporting module integrity contract
        run: |
          python -m unittest nhl.tests.test_pulso_sporting_core_245 nhl.tests.test_pulso_live_sporting_246 nhl.tests.test_pulso_individual_evidence_247 -v
          DAY="${{ inputs.day }}"
          DAY="${DAY:-$(date -u +%F)}"
          python -m nhl.pulso_sporting_core_245 \
            --report "results/pulso/nhl/$DAY/report.json" \
            --bridge "results/pulso/nhl/$DAY/sporting_bridge.json" \
            --packages "results/pulso/nhl/$DAY/verified_sporting_packages.json" \
            --live-sporting "results/pulso/nhl/$DAY/live_sporting_246.json" \
            --individual-evidence "results/pulso/nhl/$DAY/individual_evidence_247.json" \
            --goalie-daily "results/pulso/nhl/$DAY/goalie_daily_253.json" \
            --goalie-identity "results/pulso/nhl/$DAY/fixture_identity_248.json" \
            --schedule-context "results/pulso/nhl/$DAY/schedule_context.json" \
            --out "results/pulso/nhl/$DAY/sporting_core_manifest.json"
      - name: Audit fixture-level sporting evidence coverage
        run: |
          DAY="${{ inputs.day }}"
          DAY="${DAY:-$(date -u +%F)}"
          python -m nhl.pulso_evidence_coverage_222_223 \
            --report "results/pulso/nhl/$DAY/report.json" \
            --rosters "results/pulso/nhl/$DAY/official_roster_candidates.json" \
            --goalies "results/pulso/nhl/$DAY/goalie_identity_crosswalk.json" \
            --editorial "results/pulso/nhl/$DAY/editorial_lineup_observations.json" \
            --out "results/pulso/nhl/$DAY/collective_coverage.json"
      - name: Preserve fixture-level coverage by immutable run ID
        run: |
          DAY="${{ inputs.day }}"
          DAY="${DAY:-$(date -u +%F)}"
          mkdir -p frontend/data/nhl-coverage
          cp "results/pulso/nhl/$DAY/collective_coverage.json" "frontend/data/nhl-coverage/run-${{ github.run_id }}-collective_coverage.json"
      - name: Freeze unique prospective source ledger entry
        run: |
          DAY="${{ inputs.day }}"
          DAY="${DAY:-$(date -u +%F)}"
          python -m nhl.pulso_prospective_ledger_209 --report "results/pulso/nhl/$DAY/report.json" --output-dir frontend/data/nhl-ledger --run-id "${{ github.run_id }}"
      - name: Download and verify outcome-only historical labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .nhl_labels
          gh release download nhl-historical-2811-2026 --repo "$GITHUB_REPOSITORY" --pattern nhl_postgame_labels.csv --dir .nhl_labels
          gh release download nhl-historical-2811-2026 --repo "$GITHUB_REPOSITORY" --pattern labels_manifest.json --dir .nhl_labels
      - name: Freeze player-linked prospective inputs before any forecast issuance
        run: |
          DAY="${{ inputs.day }}"
          DAY="${DAY:-$(date -u +%F)}"
          python -m nhl.match_context \
            --pregame-evidence-dir "results/pulso/nhl/$DAY" \
            --run-id "${{ github.run_id }}" \
            --output "nhl/learning/pregame/run-${{ github.run_id }}.json"
      - name: Compare projected skaters against previous-game participation
        run: |
          DAY="${{ inputs.day }}"
          DAY="${DAY:-$(date -u +%F)}"
          python -m nhl.lineup_changes --evidence "nhl/learning/pregame/run-${{ github.run_id }}.json" --reference "results/pulso/nhl/$DAY/prior_lineup_reference.json" --history "results/pulso/nhl/$DAY/skater_history.json" --output "results/pulso/nhl/$DAY/lineup_changes.json"
      - name: Quantify absent contributions and conditional replacement minutes
        run: |
          DAY="${{ inputs.day }}"
          DAY="${DAY:-$(date -u +%F)}"
          python -m nhl.absence_exposure --changes "results/pulso/nhl/$DAY/lineup_changes.json" --report "results/pulso/nhl/$DAY/report.json" --output "results/pulso/nhl/$DAY/absence_exposure.json"
          cp "results/pulso/nhl/$DAY/absence_exposure.json" frontend/data/nhl-absence-exposure.json
      - name: Measure individual coverage and historical lineup features
        run: |
          DAY="${{ inputs.day }}"
          DAY="${DAY:-$(date -u +%F)}"
          python -m nhl.lineup_features --changes "results/pulso/nhl/$DAY/lineup_changes.json" --output "results/pulso/nhl/$DAY/lineup_features.json"
      - name: Preserve immutable prospective lineup dataset and source archive
        run: |
          DAY="${{ inputs.day }}"
          DAY="${DAY:-$(date -u +%F)}"
          python -m nhl.freeze_lineup_dataset --directory "results/pulso/nhl/$DAY" --destination "nhl/learning/lineups/run-${{ github.run_id }}.json" --run-id "${{ github.run_id }}"
      - name: Freeze experimental five-market predictions before puck drop
        run: |
          DAY="${{ inputs.day }}"
          DAY="${DAY:-$(date -u +%F)}"
          python -m nhl.pulso_outcome_forecast_218 \
            --report "results/pulso/nhl/$DAY/report.json" \
            --labels .nhl_labels/nhl_postgame_labels.csv \
            --manifest .nhl_labels/labels_manifest.json \
            --schedule-context "results/pulso/nhl/$DAY/schedule_context.json" \
            --lineup-exposure "results/pulso/nhl/$DAY/absence_exposure.json" \
            --out-dir "frontend/data/nhl-forecasts/run-${{ github.run_id }}"
      - name: Audit frozen experimental forecasts before publication
        run: |
          DAY="${{ inputs.day }}"
          DAY="${DAY:-$(date -u +%F)}"
          python -m nhl.pulso_pregame_publication_273 \
            --report "results/pulso/nhl/$DAY/report.json" \
            --forecast-dir "frontend/data/nhl-forecasts/run-${{ github.run_id }}" \
            --out "results/pulso/nhl/$DAY/publication_audit_273.json"
      - name: Publish verified experimental ML baseline for website
        run: |
          python -m nhl.pulso_web_baseline_243 \
            --forecast-dir "frontend/data/nhl-forecasts/run-${{ github.run_id }}" \
            --out frontend/data/nhl-baseline-latest.json
      - name: Publish complete official day slate with explicit forecast availability
        run: |
          DAY="${{ inputs.day }}"
          DAY="${DAY:-$(date -u +%F)}"
          python -m nhl.pulso_daily_slate_274 \
            --schedule "results/pulso/nhl/$DAY/schedule_evidence.json" \
            --report "results/pulso/nhl/$DAY/report.json" \
            --forecast-dir "frontend/data/nhl-forecasts/run-${{ github.run_id }}" \
            --out frontend/data/nhl-complete-slate-latest.json
      - name: Publish complete five-market experimental daily presentation
        run: |
          python -m nhl.pulso_research_presentation_275 \
            --slate frontend/data/nhl-complete-slate-latest.json \
            --run-id "${{ github.run_id }}" \
            --out frontend/data/nhl-daily-predictions-latest.json
      - name: Calculate explicit minute-based Poisson ML sensitivity
        run: python -m nhl.minute_adjusted_ml --publication frontend/data/nhl-daily-predictions-latest.json --exposure frontend/data/nhl-absence-exposure.json --output frontend/data/nhl-minute-adjusted-ml.json
      - name: Execute compatible goalie ML candidate or record explicit unavailability
        env:
          REQUESTED_DAY: ${{ inputs.day }}
        run: |
          DAY="${REQUESTED_DAY:-$(date -u +%F)}"
          python -m nhl.goalie_ml_inference run \
            --run-id "${{ github.run_id }}" \
            --slate frontend/data/nhl-daily-predictions-latest.json \
            --model nhl/models/goalie-ml-candidate.json \
            --scenarios "results/pulso/nhl/$DAY/goalie_scenarios_258.json" \
            --scenario-history "results/pulso/nhl/$DAY/all_goalie_candidates_260.json" \
            --output "nhl/learning/goalie-predictions/run-${{ github.run_id }}.json"
          cp "nhl/learning/goalie-predictions/run-${{ github.run_id }}.json" frontend/data/nhl-goalie-comparison-latest.json
      - name: Freeze append-only daily prediction snapshot for future scoring
        run: |
          python -m nhl.pulso_prospective_monitor_276 freeze \
            --slate frontend/data/nhl-daily-predictions-latest.json \
            --run-id "${{ github.run_id }}" \
            --out-dir frontend/data/nhl-prediction-snapshots
      - uses: actions/upload-artifact@v6
        with:
          name: pulso-nhl-pregame-evidence-${{ github.run_id }}
          path: |
            results/pulso/nhl/
            nhl/learning/pregame/
            nhl/learning/goalie-predictions/
            frontend/data/nhl-forecasts/run-${{ github.run_id }}/
          retention-days: 90
      - name: Publish source readiness only, no predictions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f nhl/learning/goalie-predictions/run-${{ github.run_id }}.json frontend/data/nhl-goalie-comparison-latest.json
          git add -f nhl/learning/lineups/run-${{ github.run_id }}.json nhl/learning/lineups/run-${{ github.run_id }}.sources.json.gz
          git add -f nhl/learning/pregame/run-${{ github.run_id }}.json nhl/learning/pregame/run-${{ github.run_id }}.sources.json.gz
          git add -f frontend/data/nhl-minute-adjusted-ml.json frontend/data/nhl-absence-exposure.json frontend/data/pulso-nhl-research.json frontend/data/nhl-daily-predictions-latest.json frontend/data/nhl-complete-slate-latest.json frontend/data/nhl-ledger/run-${{ github.run_id }}.json frontend/data/nhl-baseline-latest.json
          git add -f frontend/data/nhl-coverage/run-${{ github.run_id }}-collective_coverage.json frontend/data/nhl-prediction-snapshots/run-${{ github.run_id }}.json
          if compgen -G 'frontend/data/nhl-forecasts/run-${{ github.run_id }}/*.json' > /dev/null; then
            git add -f frontend/data/nhl-forecasts/run-${{ github.run_id }}/*.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "data: prospective NHL source readiness (no picks)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

  integrated-model:
    if: github.event_name != 'pull_request'
    needs: capture
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v6
        with:
          name: pulso-nhl-pregame-evidence-${{ github.run_id }}
          path: .
      - name: Assemble and run integrated NHL scenarios from captured evidence
        env:
          REQUESTED_DAY: ${{ inputs.day }}
        run: |
          DAY="${REQUESTED_DAY:-$(date -u +%F)}"
          python -m nhl.joint_match_input_builder_321 \
            --report "results/pulso/nhl/$DAY/report.json" \
            --context "nhl/learning/pregame/run-${{ github.run_id }}.json" \
            --changes "results/pulso/nhl/$DAY/lineup_changes.json" \
            --goalies "results/pulso/nhl/$DAY/all_goalie_candidates_260.json" \
            --special-teams "results/pulso/nhl/$DAY/special_teams_counts.json" \
            --cutoff "$DAY" \
            --output "results/pulso/nhl/$DAY/joint_match_inputs_321.json"
          RUN_DAY="$DAY" python - <<'PY'
          import json, os
          from pathlib import Path
          from nhl.joint_match_engine_320 import run
          directory = Path("results/pulso/nhl") / os.environ["RUN_DAY"]
          batch = json.loads((directory / "joint_match_inputs_321.json").read_text())
          executed, blocked = [], list(batch["blocked_games"])
          for inputs in batch["games"]:
              try:
                  executed.append(run(inputs))
              except (ValueError, KeyError, TypeError) as error:
                  blocked.append({"game_id": inputs["game_id"], "home": inputs["home"],
                    "away": inputs["away"], "reason": str(error)[:240]})
          result = {"kind":"nhl_joint_match_daily_runs_v322", "date":batch["date"],
            "generated_at_utc":batch["generated_at_utc"], "games":executed,
            "blocked_games":blocked, "official":False, "calibrated":False,
            "odds_used":False, "public_base_replaced":False,
            "note":"Internal execution evidence only; not the public PULSO forecast feed."}
          (directory / "joint_match_runs_322.json").write_text(json.dumps(result, indent=2) + "\n")
          print(json.dumps({"executed":len(executed), "blocked":len(blocked),
            "official":False, "calibrated":False}))
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: pulso-nhl-joint-model-${{ github.run_id }}
          path: results/pulso/nhl/
          retention-days: 90

  publish-integrated-model:
    if: github.event_name != 'pull_request'
    needs: integrated-model
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ github.token }}
      - uses: actions/download-artifact@v6
        with:
          name: pulso-nhl-joint-model-${{ github.run_id }}
          path: .
      - name: Validate and publish the latest conditional scenario feed
        env:
          REQUESTED_DAY: ${{ inputs.day }}
          RUN_ID: ${{ github.run_id }}
        run: |
          DAY="${REQUESTED_DAY:-$(date -u +%F)}"
          SOURCE="$(find . -type f -path "*/$DAY/joint_match_runs_322.json" -print -quit)"
          test -n "$SOURCE" && test -s "$SOURCE"
          python - "$SOURCE" frontend/data/nhl-joint-model-latest.json "$DAY" "$RUN_ID" <<'PY'
          import json, sys
          from datetime import datetime, timezone
          from pathlib import Path
          source, destination, day, run_id = map(str, sys.argv[1:])
          data = json.loads(Path(source).read_text())
          assert data.get("kind") == "nhl_joint_match_daily_runs_v322"
          assert data.get("date") == day
          assert data.get("official") is False and data.get("calibrated") is False
          assert data.get("odds_used") is False and data.get("public_base_replaced") is False
          assert isinstance(data.get("games"), list) and isinstance(data.get("blocked_games"), list)
          for game in data["games"]:
              assert game.get("publishable") is False and game.get("calibrated") is False
              assert game.get("status") == "conditional_unvalidated_scenarios"
          data["published_at_utc"] = datetime.now(timezone.utc).isoformat()
          data["run_id"] = run_id
          Path(destination).write_text(json.dumps(data, indent=2) + "\n")
          print(json.dumps({"date": day, "games": len(data["games"]),
              "blocked": len(data["blocked_games"]), "official": False, "calibrated": False}))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f frontend/data/nhl-joint-model-latest.json
          if ! git diff --cached --quiet; then
            git commit -m "data: publish NHL joint model scenarios"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
