name: PULSO NHL — prospective pregame source capture
on:
  schedule:
    - cron: '10 14 * * *'
    - cron: '10 20 * * *'
  workflow_dispatch:
    inputs:
      day:
        description: 'UTC/NHL schedule day (YYYY-MM-DD); leave blank for current UTC date'
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: pulso-nhl-source-capture
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m unittest nhl.tests.test_pulso_prospective_capture nhl.tests.test_pulso_209 nhl.tests.test_pulso_outcome_forecast_218 -v
  capture:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Capture current NHL source evidence
        env:
          REQUESTED_DAY: ${{ inputs.day }}
        run: |
          DAY="${REQUESTED_DAY:-$(date -u +%F)}"
          python -m nhl.pulso_prospective_capture --date "$DAY" --output-dir "results/pulso/nhl/$DAY" --public-status frontend/data/pulso-nhl-research.json
      - name: Audit fixture-attested player and goalie identities
        run: |
          DAY="${{ inputs.day }}"
          DAY="${DAY:-$(date -u +%F)}"
          python -m unittest nhl.tests.test_pulso_fixture_identity_248 -v
          python -m nhl.pulso_fixture_identity_248 \
            --report "results/pulso/nhl/$DAY/report.json" \
            --rosters "results/pulso/nhl/$DAY/official_roster_candidates.json" \
            --goalies "results/pulso/nhl/$DAY/goalie_identity_crosswalk.json" \
            --editorial "results/pulso/nhl/$DAY/editorial_lineup_observations.json" \
            --out "results/pulso/nhl/$DAY/fixture_identity_248.json"
      - name: Capture individual candidate goalie history before puck drop
        run: |
          python -m unittest nhl.tests.test_pulso_goalie_history_251 -v
          DAY="${{ inputs.day }}"
          DAY="${DAY:-$(date -u +%F)}"
          python -m nhl.pulso_goalie_history_251 \
            --report "results/pulso/nhl/$DAY/report.json" \
            --identity "results/pulso/nhl/$DAY/fixture_identity_248.json" \
            --out "results/pulso/nhl/$DAY/goalie_history_251.json"
      - name: Compute non-calibrated goalie performance indicators
        run: |
          python -m unittest nhl.tests.test_pulso_goalie_daily_253 -v
          DAY="${{ inputs.day }}"
          DAY="${DAY:-$(date -u +%F)}"
          python -m nhl.pulso_goalie_daily_253 \
            --history "results/pulso/nhl/$DAY/goalie_history_251.json" \
            --out "results/pulso/nhl/$DAY/goalie_daily_253.json"
      - name: Normalize observed NHL sporting source evidence
        run: |
          DAY="${{ inputs.day }}"
          DAY="${DAY:-$(date -u +%F)}"
          python -m nhl.pulso_sporting_bridge_226 \
            --report "results/pulso/nhl/$DAY/report.json" \
            --crosswalk "results/pulso/nhl/$DAY/goalie_identity_crosswalk.json" \
            --rosters "results/pulso/nhl/$DAY/official_roster_candidates.json" \
            --out "results/pulso/nhl/$DAY/sporting_bridge.json"
      - name: Produce gated quantitative sporting research vector
        run: |
          DAY="${{ inputs.day }}"
          DAY="${DAY:-$(date -u +%F)}"
          mkdir -p "results/pulso/nhl/$DAY"
          echo '{}' > "results/pulso/nhl/$DAY/verified_sporting_packages.json"
          python -m nhl.pulso_quantitative_signals_227 \
            --bridge "results/pulso/nhl/$DAY/sporting_bridge.json" \
            --packages "results/pulso/nhl/$DAY/verified_sporting_packages.json" \
            --out "results/pulso/nhl/$DAY/quantitative_signals.json"
      - name: Capture official NHL prior-day team form and observed PP/PK
        run: |
          DAY="${{ inputs.day }}"
          DAY="${DAY:-$(date -u +%F)}"
          python -m nhl.pulso_live_sporting_246 \
            --report "results/pulso/nhl/$DAY/report.json" \
            --out "results/pulso/nhl/$DAY/live_sporting_246.json"
      - name: Preserve fixture-level individual player and goalie evidence
        run: |
          DAY="${{ inputs.day }}"
          DAY="${DAY:-$(date -u +%F)}"
          echo '{}' > "results/pulso/nhl/$DAY/verified_lineup_history_packages.json"
          python -m nhl.pulso_individual_evidence_247 \
            --report "results/pulso/nhl/$DAY/report.json" \
            --packages "results/pulso/nhl/$DAY/verified_lineup_history_packages.json" \
            --out "results/pulso/nhl/$DAY/individual_evidence_247.json"
      - name: Audit real fixture-level sporting source coverage
        run: |
          python -m unittest nhl.tests.test_pulso_source_coverage_249 nhl.tests.test_pulso_goalie_integration_254 -v
          DAY="${{ inputs.day }}"
          DAY="${DAY:-$(date -u +%F)}"
          python -m nhl.pulso_source_coverage_249 \
            --report "results/pulso/nhl/$DAY/report.json" \
            --identity "results/pulso/nhl/$DAY/fixture_identity_248.json" \
            --individual "results/pulso/nhl/$DAY/individual_evidence_247.json" \
            --team-form "results/pulso/nhl/$DAY/live_sporting_246.json" \
            --goalie-daily "results/pulso/nhl/$DAY/goalie_daily_253.json" \
            --out "results/pulso/nhl/$DAY/source_coverage_249.json"
      - name: Execute original NHL sporting module integrity contract
        run: |
          python -m unittest nhl.tests.test_pulso_sporting_core_245 nhl.tests.test_pulso_live_sporting_246 nhl.tests.test_pulso_individual_evidence_247 -v
          DAY="${{ inputs.day }}"
          DAY="${DAY:-$(date -u +%F)}"
          python -m nhl.pulso_sporting_core_245 \
            --report "results/pulso/nhl/$DAY/report.json" \
            --bridge "results/pulso/nhl/$DAY/sporting_bridge.json" \
            --packages "results/pulso/nhl/$DAY/verified_sporting_packages.json" \
            --live-sporting "results/pulso/nhl/$DAY/live_sporting_246.json" \
            --individual-evidence "results/pulso/nhl/$DAY/individual_evidence_247.json" \
            --goalie-daily "results/pulso/nhl/$DAY/goalie_daily_253.json" \
            --goalie-identity "results/pulso/nhl/$DAY/fixture_identity_248.json" \
            --out "results/pulso/nhl/$DAY/sporting_core_manifest.json"
      - name: Audit fixture-level sporting evidence coverage
        run: |
          DAY="${{ inputs.day }}"
          DAY="${DAY:-$(date -u +%F)}"
          python -m nhl.pulso_evidence_coverage_222_223 \
            --report "results/pulso/nhl/$DAY/report.json" \
            --rosters "results/pulso/nhl/$DAY/official_roster_candidates.json" \
            --goalies "results/pulso/nhl/$DAY/goalie_identity_crosswalk.json" \
            --editorial "results/pulso/nhl/$DAY/editorial_lineup_observations.json" \
            --out "results/pulso/nhl/$DAY/collective_coverage.json"
      - name: Preserve fixture-level coverage by immutable run ID
        run: |
          DAY="${{ inputs.day }}"
          DAY="${DAY:-$(date -u +%F)}"
          mkdir -p frontend/data/nhl-coverage
          cp "results/pulso/nhl/$DAY/collective_coverage.json" "frontend/data/nhl-coverage/run-${{ github.run_id }}-collective_coverage.json"
      - name: Freeze unique prospective source ledger entry
        run: |
          DAY="${{ inputs.day }}"
          DAY="${DAY:-$(date -u +%F)}"
          python -m nhl.pulso_prospective_ledger_209 --report "results/pulso/nhl/$DAY/report.json" --output-dir frontend/data/nhl-ledger --run-id "${{ github.run_id }}"
      - name: Download and verify outcome-only historical labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .nhl_labels
          gh release download nhl-historical-2811-2026 --repo "$GITHUB_REPOSITORY" --pattern nhl_postgame_labels.csv --dir .nhl_labels
          gh release download nhl-historical-2811-2026 --repo "$GITHUB_REPOSITORY" --pattern labels_manifest.json --dir .nhl_labels
      - name: Freeze experimental five-market predictions before puck drop
        run: |
          DAY="${{ inputs.day }}"
          DAY="${DAY:-$(date -u +%F)}"
          python -m nhl.pulso_outcome_forecast_218 \
            --report "results/pulso/nhl/$DAY/report.json" \
            --labels .nhl_labels/nhl_postgame_labels.csv \
            --manifest .nhl_labels/labels_manifest.json \
            --out-dir "frontend/data/nhl-forecasts/run-${{ github.run_id }}"
      - name: Publish verified experimental ML baseline for website
        run: |
          python -m nhl.pulso_web_baseline_243 \
            --forecast-dir "frontend/data/nhl-forecasts/run-${{ github.run_id }}" \
            --out frontend/data/nhl-baseline-latest.json
      - uses: actions/upload-artifact@v6
        with:
          name: pulso-nhl-pregame-evidence-${{ github.run_id }}
          path: |
            results/pulso/nhl/
            frontend/data/nhl-forecasts/run-${{ github.run_id }}/
          retention-days: 90
      - name: Publish source readiness only, no predictions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f frontend/data/pulso-nhl-research.json frontend/data/nhl-ledger/run-${{ github.run_id }}.json frontend/data/nhl-baseline-latest.json
          git add -f frontend/data/nhl-coverage/run-${{ github.run_id }}-collective_coverage.json
          if compgen -G 'frontend/data/nhl-forecasts/run-${{ github.run_id }}/*.json' > /dev/null; then
            git add -f frontend/data/nhl-forecasts/run-${{ github.run_id }}/*.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "data: prospective NHL source readiness (no picks)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
