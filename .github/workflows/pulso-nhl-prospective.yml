name: PULSO NHL — prospective pregame source capture
on:
  schedule:
    - cron: '10 14 * * *'
    - cron: '10 20 * * *'
  workflow_dispatch:
    inputs:
      day:
        description: 'UTC/NHL schedule day (YYYY-MM-DD); leave blank for current UTC date'
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: pulso-nhl-source-capture
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m unittest nhl.tests.test_pulso_prospective_capture nhl.tests.test_pulso_209 -v
  capture:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Capture current NHL source evidence
        env:
          REQUESTED_DAY: ${{ inputs.day }}
        run: |
          DAY="${REQUESTED_DAY:-$(date -u +%F)}"
          python -m nhl.pulso_prospective_capture --date "$DAY" --output-dir "results/pulso/nhl/$DAY" --public-status frontend/data/pulso-nhl-research.json
      - name: Freeze unique prospective source ledger entry\n        run: |\n          DAY="${{ inputs.day }}"\n          DAY="${DAY:-$(date -u +%F)}"\n          python -m nhl.pulso_prospective_ledger_209 --report "results/pulso/nhl/$DAY/report.json" --output-dir frontend/data/nhl-ledger --run-id "${{ github.run_id }}"\n      - uses: actions/upload-artifact@v6
        with:
          name: pulso-nhl-pregame-evidence-${{ github.run_id }}
          path: results/pulso/nhl/
          retention-days: 90
      - name: Publish source readiness only, no predictions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f frontend/data/pulso-nhl-research.json frontend/data/nhl-ledger/run-${{ github.run_id }}.json
          if ! git diff --cached --quiet; then
            git commit -m "data: prospective NHL source readiness (no picks)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
