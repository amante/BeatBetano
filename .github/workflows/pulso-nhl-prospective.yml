name: PULSO NHL — prospective pregame source capture
on:
  schedule:
    - cron: '10 14 * * *'
    - cron: '10 20 * * *'
  workflow_dispatch:
    inputs:
      day:
        description: 'UTC/NHL schedule day (YYYY-MM-DD); leave blank for current UTC date'
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: pulso-nhl-source-capture
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m unittest nhl.tests.test_pulso_prospective_capture nhl.tests.test_pulso_209 nhl.tests.test_pulso_outcome_forecast_218 -v
  capture:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Capture current NHL source evidence
        env:
          REQUESTED_DAY: ${{ inputs.day }}
        run: |
          DAY="${REQUESTED_DAY:-$(date -u +%F)}"
          python -m nhl.pulso_prospective_capture --date "$DAY" --output-dir "results/pulso/nhl/$DAY" --public-status frontend/data/pulso-nhl-research.json
      - name: Freeze unique prospective source ledger entry\n        run: |\n          DAY="${{ inputs.day }}"\n          DAY="${DAY:-$(date -u +%F)}"\n          python -m nhl.pulso_prospective_ledger_209 --report "results/pulso/nhl/$DAY/report.json" --output-dir frontend/data/nhl-ledger --run-id "${{ github.run_id }}"\n      - name: Download and verify outcome-only historical labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .nhl_labels
          gh release download nhl-historical-2811-2026 --repo "$GITHUB_REPOSITORY" --pattern nhl_postgame_labels.csv --dir .nhl_labels
          gh release download nhl-historical-2811-2026 --repo "$GITHUB_REPOSITORY" --pattern labels_manifest.json --dir .nhl_labels
      - name: Freeze experimental five-market predictions before puck drop
        run: |
          DAY="${{ inputs.day }}"
          DAY="${DAY:-$(date -u +%F)}"
          python -m nhl.pulso_outcome_forecast_218 \
            --report "results/pulso/nhl/$DAY/report.json" \
            --labels .nhl_labels/nhl_postgame_labels.csv \
            --manifest .nhl_labels/labels_manifest.json \
            --out-dir "frontend/data/nhl-forecasts/run-${{ github.run_id }}"
      - uses: actions/upload-artifact@v6
        with:
          name: pulso-nhl-pregame-evidence-${{ github.run_id }}
          path: |\n            results/pulso/nhl/\n            frontend/data/nhl-forecasts/run-${{ github.run_id }}/
          retention-days: 90
      - name: Publish source readiness only, no predictions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f frontend/data/pulso-nhl-research.json frontend/data/nhl-ledger/run-${{ github.run_id }}.json\n          if compgen -G 'frontend/data/nhl-forecasts/run-${{ github.run_id }}/*.json' > /dev/null; then\n            git add -f frontend/data/nhl-forecasts/run-${{ github.run_id }}/*.json\n          fi
          if ! git diff --cached --quiet; then
            git commit -m "data: prospective NHL source readiness (no picks)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
