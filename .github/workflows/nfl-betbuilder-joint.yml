name: NFL BetBuilder joint simulation
on:
  pull_request:
    paths: ['nfl/**', 'multisport/**', '.github/workflows/nfl-betbuilder-joint.yml']
  push:
    paths: ['nfl/**', 'multisport/**', '.github/workflows/nfl-betbuilder-joint.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  joint-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - run: python -m unittest discover -s nfl/tests -v
      - run: python -m unittest discover -s multisport/tests -v
