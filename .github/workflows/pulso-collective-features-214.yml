name: PULSO NHL #214 — collective evidence vector
on:
  pull_request:
    paths:
      - nhl/pulso_collective_features_214.py
      - nhl/tests/test_pulso_collective_features_214.py
      - .github/workflows/pulso-collective-features-214.yml
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m unittest nhl.tests.test_pulso_collective_features_214 -v
