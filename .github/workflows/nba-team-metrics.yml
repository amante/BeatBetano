name: NBA team metrics source and fallback
on:
  workflow_dispatch:
    inputs:
      target_date:
        description: Forecast date (YYYY-MM-DD)
        required: true
        type: string
      nba_game_ids:
        description: Completed regular-season NBA game IDs, separated by spaces
        required: true
        type: string
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: Capture official team metrics or estimate from final boxscores
        env:
          TARGET_DATE: ${{ inputs.target_date }}
          NBA_GAME_IDS: ${{ inputs.nba_game_ids }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          command = [sys.executable, 'nba/livedata_team_metrics.py',
                     '--date', os.environ['TARGET_DATE'], '--output-dir', 'nba-team-metrics']
          for game_id in os.environ['NBA_GAME_IDS'].split():
              command.extend(['--game-id', game_id])
          subprocess.run(command, check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nba-team-metrics
          path: nba-team-metrics/
