name: NBA historical real scoreboard smoke
on:
  pull_request:
    paths: ['nba/**','.github/workflows/nba-espn-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - run: python -m unittest discover -s nba/tests -v
      - run: python nba/espn_games.py --start 2024-10-22 --end 2024-10-31 --output results/nba/games.json
      - uses: actions/upload-artifact@v4
        with:
          name: nba-espn-historical-sample
          path: results/nba/
          retention-days: 14
