name: NHL — Rolling goalie windows and season-phase ML test
on:
  workflow_dispatch:
  pull_request:
    paths:
      - nhl/rolling_goalie_features.py
      - nhl/rolling_goalie_holdout.py
      - nhl/tests/test_rolling_goalie_features.py
      - .github/workflows/nhl-rolling-goalie-window.yml
permissions:
  contents: read
jobs:
  historical:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Regression tests for leakage and field parsing
        run: python -m unittest nhl.tests.test_rolling_goalie_features -v
      - name: Install historical audit dependency
        run: python -m pip install requests
      - name: Load immutable original NHL history
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .nhl_source/archive .labels results/nhl\n          gh release download nhl-historical-2811-2026 --repo "$GITHUB_REPOSITORY" \\\n            --pattern nhl_postgame_labels.csv --pattern labels_manifest.json --dir .labels
          gh release download nhl-historical-2811-2026 --repo "$GITHUB_REPOSITORY" \
            --pattern nhl-complete-2811-source.tar.gz --pattern archive_sha256.json --dir .nhl_source
          tar -xzf .nhl_source/nhl-complete-2811-source.tar.gz -C .nhl_source/archive
      - name: Check all source digests and extract
        if: github.event_name == 'workflow_dispatch'
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          archive=Path(".nhl_source/archive")
          sums=json.loads(Path(".nhl_source/archive_sha256.json").read_text())
          if len([k for k in sums if k!="manifest.json"])!=2811:
            raise SystemExit("Source manifest has incomplete game coverage")
          for name,expected in sums.items():
            if Path(name).name!=name:raise SystemExit("Unsafe filename")
            p=archive/name
            if not p.is_file() or hashlib.sha256(p.read_bytes()).hexdigest()!=expected:
              raise SystemExit("Source SHA256 mismatch: "+name)
          PY
          python nhl/rolling_goalie_features.py \
            --archive .nhl_source/archive \
            --output results/nhl/rolling_goalie_features.json \
            --manifest results/nhl/rolling_goalie_features_manifest.json
      - name: Verify labels checksum and evaluate rolling windows
        if: github.event_name == 'workflow_dispatch'
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          m=json.loads(Path('.labels/labels_manifest.json').read_text())
          if m['games']!=2811 or m['sha256']!=hashlib.sha256(Path('.labels/nhl_postgame_labels.csv').read_bytes()).hexdigest():
            raise SystemExit('Label digest mismatch')
          PY
          python nhl/rolling_goalie_holdout.py \
            --labels .labels/nhl_postgame_labels.csv \
            --features results/nhl/rolling_goalie_features.json \
            --output results/nhl/rolling_goalie_holdout.json
      - name: Retain chronological research dataset
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: nhl-rolling-goalie-${{ github.run_id }}
          path: results/nhl/rolling_goalie*.json
          retention-days: 90
