name: Frontend static checks
on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/frontend-checks.yml'
  push:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/frontend-checks.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: |
          node --check frontend/app.js
          node --check frontend/portal.js
          node --check frontend/daily.js
          node --check frontend/nba-predictions.js
          node --test frontend/tests/nba-forward.test.cjs
          node --check frontend/nhl-layout.js
          node --check frontend/nhl-postmortem.js
          node --check frontend/nhl-match-context.js
          node --check frontend/nhl-goalie-comparison.js
          node --test frontend/tests/nhl-goalie-comparison.test.cjs
          node --test frontend/tests/nhl-match-context.test.cjs
          node --test frontend/tests/nhl-calendar.test.mjs
          node --check frontend/nhl-five-market.js
          node --test backend/tests/*.test.mjs frontend/tests/nhl-dispatch.test.cjs
          ! grep -q 'type="file"' frontend/dashboard.html
          grep -q 'id="run-simulation"' frontend/dashboard.html
          grep -q 'name="simulation-scope"' frontend/dashboard.html
      - run: |
          test -s frontend/index.html
          test -s frontend/styles.css
          test -s frontend/portal.css
          test -s frontend/daily.css
          python -m py_compile frontend/collect_daily.py frontend/merge_daily_history.py
          python -m unittest discover -s frontend/tests -v
          test -s frontend/dashboard.html
          grep -q 'id="login-overlay"' frontend/index.html
          grep -q 'class="sport-grid"' frontend/index.html
          test -s frontend/README.md
          grep -q 'id="daily-results"' frontend/dashboard.html
          ! grep -q 'id="file-input"' frontend/dashboard.html
