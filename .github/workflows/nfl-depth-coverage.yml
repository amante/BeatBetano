name: NFL timestamped depth-chart coverage 2025
on:
  pull_request:
    paths: ['validation/**','.github/workflows/nfl-depth-coverage.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r validation/requirements.txt
      - run: python -m unittest discover -s validation/tests -v
      - run: python validation/backtest.py fetch-nfl --output data/games.csv
      - name: Audit dated depth chart coverage
        run: python validation/nfl_depth_snapshots.py --games data/games.csv --seasons 2025 --output results/depth_2025
      - uses: actions/upload-artifact@v4
        with:
          name: nfl-depth-pregame-2025
          path: results/depth_2025/
          retention-days: 30
