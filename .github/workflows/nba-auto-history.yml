name: NBA automatic verified-history pregame
on:
  pull_request:
    paths:
      - 'nba/**'
      - '.github/workflows/nba-auto-history.yml'
  workflow_dispatch:
    inputs:
      game_date:
        description: 'NBA ESPN scoreboard date YYYY-MM-DD (US league calendar)'
        required: true
        type: string
      history_run_id:
        description: 'Successful NBA prepare historical evidence workflow run ID for same game_date'
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install requests beautifulsoup4 pypdf
      - run: python -m unittest discover -s nba/tests -v
      - run: python -m unittest discover -s multisport/tests -v
      - run: python -m unittest discover -s webresults/tests -v
  generate:
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install requests pypdf
      - name: Validate scoreboard date and capture timestamp
        env:
          GAME_DATE: ${{ inputs.game_date }}
        run: |
          python - <<'PY'
          from datetime import date
          import os
          day=date.fromisoformat(os.environ["GAME_DATE"])
          if day.year<2026 or day.year>2027:
              raise ValueError("Game date outside supported current NBA season")
          PY
          echo "HISTORY_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Capture NBA pregame candidates immediately before historical processing
        env:
          GAME_DATE: ${{ inputs.game_date }}
        run: |
          python nba/current_feed.py --date "$GAME_DATE" --timestamp "$HISTORY_TIME" --output results/nba/initial_scoreboard.json
          cat results/nba/initial_scoreboard.json | python -c 'import json,sys; x=json.load(sys.stdin); print("Initial pregame candidates:",len(x["future_fixtures"]))'
      - name: Download precomputed historical evidence
        uses: actions/download-artifact@v4
        with:
          name: nba-prepared-${{ inputs.game_date }}
          run-id: ${{ inputs.history_run_id }}
          github-token: ${{ github.token }}
          path: results/nba
      - name: Validate precomputed historical evidence
        env:
          GAME_DATE: ${{ inputs.game_date }}
        run: |
          python nba/prepared_history_gate.py --date "$GAME_DATE" --history results/nba/history.json --audit results/nba/history_audit.json --players results/nba/player_game_history.json --teams results/nba/team_boxscores.json
      - name: Audit Elo Challenger hybrid and sports-factor ablations
        run: |
          python nba/feature_impact_audit.py --history results/nba/history.json --output results/nba/feature_impact_audit.json --summary results/nba/feature_impact_audit.md
          cat results/nba/feature_impact_audit.md >> "$GITHUB_STEP_SUMMARY"
      - name: Audit early-season hybrid guardrail sample thresholds
        run: |
          python nba/hybrid_gate_audit.py --history results/nba/history.json --output results/nba/hybrid_gate_audit.json --summary results/nba/hybrid_gate_audit.md
          cat results/nba/hybrid_gate_audit.md >> "$GITHUB_STEP_SUMMARY"
      - name: Audit fixtures crossing tipoff during historical processing
        run: |
          python nba/pregame_time_window_audit.py --scoreboard results/nba/initial_scoreboard.json --output results/nba/pregame_time_window.json --summary results/nba/pregame_time_window.md
          cat results/nba/pregame_time_window.md >> "$GITHUB_STEP_SUMMARY"
      - name: Generate three-model frozen pregame snapshot
        env:
          GAME_DATE: ${{ inputs.game_date }}
        run: |
          python nba/daily_pipeline.py --history results/nba/history.json --date "$GAME_DATE" --output results/nba/prospective/snapshot.json --allow-empty
      - name: Report empty slate without treating it as a model failure
        if: ${{ hashFiles('results/nba/prospective/snapshot.json') == '' }}
        run: |
          echo '## NBA pregame: no eligible games remain' >> "$GITHUB_STEP_SUMMARY"
          echo 'No pretip snapshot was produced. Historical diagnostics are retained; downstream pregame analysis is intentionally skipped to prevent post-tip leakage.' >> "$GITHUB_STEP_SUMMARY"
      - name: Report historical rotation/minutes and unfilled efficiency fields
        if: ${{ hashFiles('results/nba/prospective/snapshot.json') != '' && hashFiles('results/nba/player_game_history.json') != '' }}
        run: |
          python nba/rotation_efficiency_report.py --snapshot results/nba/prospective/snapshot.json --history results/nba/history.json --players results/nba/player_game_history.json --output results/nba/prospective/rotation_efficiency_report.json --summary results/nba/prospective/rotation_efficiency_report.md
          cat results/nba/prospective/rotation_efficiency_report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Report confirmed lineup coverage and possession-driven matchup projections
        if: ${{ hashFiles('results/nba/prospective/snapshot.json') != '' && hashFiles('results/nba/team_boxscores.json') != '' }}
        run: |
          python nba/possession_intelligence.py --snapshot results/nba/prospective/snapshot.json --history results/nba/history.json --observations results/nba/team_boxscores.json --output results/nba/prospective/possession_intelligence.json --summary results/nba/prospective/possession_intelligence.md
          cat results/nba/prospective/possession_intelligence.md >> "$GITHUB_STEP_SUMMARY"
      - name: Flag disagreement between NBA hybrid winners and scoring projections
        if: ${{ hashFiles('results/nba/prospective/possession_intelligence.json') != '' }}
        run: |
          python nba/probability_score_audit.py --snapshot results/nba/prospective/snapshot.json --possessions results/nba/prospective/possession_intelligence.json --output results/nba/prospective/probability_score_audit.json --summary results/nba/prospective/probability_score_audit.md
          cat results/nba/prospective/probability_score_audit.md >> "$GITHUB_STEP_SUMMARY"
      - name: Compare NBA possession-informed challenger against frozen three-model probabilities
        if: ${{ hashFiles('results/nba/prospective/possession_intelligence.json') != '' }}
        run: |
          python nba/possession_challenger.py --snapshot results/nba/prospective/snapshot.json --possessions results/nba/prospective/possession_intelligence.json --output results/nba/prospective/possession_challenger.json --summary results/nba/prospective/possession_challenger.md
          cat results/nba/prospective/possession_challenger.md >> "$GITHUB_STEP_SUMMARY"
      - name: Audit NBA each offense against the opposing defense
        if: ${{ hashFiles('results/nba/prospective/possession_intelligence.json') != '' }}
        run: |
          python nba/offense_defense_matchups.py --snapshot results/nba/prospective/snapshot.json --possessions results/nba/prospective/possession_intelligence.json --output results/nba/prospective/offense_defense_matchups.json --summary results/nba/prospective/offense_defense_matchups.md
          cat results/nba/prospective/offense_defense_matchups.md >> "$GITHUB_STEP_SUMMARY"
      - name: Fetch projected/confirmed NBA lineups from RotoWire fallback
        if: ${{ hashFiles('results/nba/prospective/snapshot.json') != '' }}
        run: |
          python nba/lineup_live_collector.py --snapshot results/nba/prospective/snapshot.json --output results/nba/prospective/lineup_cascade.json --summary results/nba/prospective/lineup_cascade.md --candidates results/nba/prospective/lineup_source_candidates.json
          cat results/nba/prospective/lineup_cascade.md >> "$GITHUB_STEP_SUMMARY"
      - name: Reconcile sourced NBA projected lineups against historical player identities
        if: ${{ hashFiles('results/nba/prospective/lineup_cascade.json') != '' && hashFiles('results/nba/prospective/rotation_efficiency_report.json') != '' }}
        run: |
          python nba/lineup_roster_reconciliation.py --snapshot results/nba/prospective/snapshot.json --rotation results/nba/prospective/rotation_efficiency_report.json --lineups results/nba/prospective/lineup_cascade.json --output results/nba/prospective/lineup_roster_reconciliation.json --summary results/nba/prospective/lineup_roster_reconciliation.md
          cat results/nba/prospective/lineup_roster_reconciliation.md >> "$GITHUB_STEP_SUMMARY"
      - name: Fetch current ESPN NBA team rosters (membership, not game availability)
        if: ${{ hashFiles('results/nba/prospective/snapshot.json') != '' }}
        run: |
          python nba/espn_current_roster_feed.py --snapshot results/nba/prospective/snapshot.json --output results/nba/prospective/current_roster_feed.json
      - name: Collect independently sourced NBA sporting observations
        if: ${{ hashFiles('results/nba/prospective/snapshot.json') != '' }}
        id: sporting
        continue-on-error: true
        run: |
          python nba/sporting_feed.py --snapshot results/nba/prospective/snapshot.json --output results/nba/prospective/sporting_observations.json
      - name: Reconcile injury claims to current NBA roster player IDs
        if: ${{ hashFiles('results/nba/prospective/current_roster_feed.json') != '' }}
        run: |
          python nba/player_status_intake.py --snapshot results/nba/prospective/snapshot.json --roster results/nba/prospective/current_roster_feed.json --sporting results/nba/prospective/sporting_observations.json --output results/nba/prospective/current_status_feed.json
      - name: Resolve verified current NBA roster and status evidence
        if: ${{ hashFiles('results/nba/prospective/lineup_cascade.json') != '' }}
        run: |
          python nba/active_roster_resolver.py --snapshot results/nba/prospective/snapshot.json --roster results/nba/prospective/current_roster_feed.json --statuses results/nba/prospective/current_status_feed.json --lineups results/nba/prospective/lineup_cascade.json --output results/nba/prospective/active_roster_resolved.json --summary results/nba/prospective/active_roster_resolved.md
          cat results/nba/prospective/active_roster_resolved.md >> "$GITHUB_STEP_SUMMARY"
          python nba/joint_minutes_report.py --snapshot results/nba/prospective/snapshot.json --rotation results/nba/prospective/rotation_efficiency_report.json --availability results/nba/prospective/active_roster_resolved.json --output results/nba/prospective/joint_minutes.json --summary results/nba/prospective/joint_minutes.md
      - name: Evaluate bounded NBA injury availability scenarios
        if: ${{ hashFiles('results/nba/prospective/active_roster_resolved.json') != '' }}
        run: |
          python nba/availability_scenarios.py --snapshot results/nba/prospective/snapshot.json --rotation results/nba/prospective/rotation_efficiency_report.json --availability results/nba/prospective/active_roster_resolved.json --output results/nba/prospective/availability_scenarios.json
      - name: Audit evidence coverage before downstream model claims
        if: ${{ hashFiles('results/nba/prospective/active_roster_resolved.json') != '' }}
        run: |
          python nba/pipeline_readiness_audit.py --snapshot results/nba/prospective/snapshot.json --roster results/nba/prospective/current_roster_feed.json --availability results/nba/prospective/active_roster_resolved.json --minutes results/nba/prospective/joint_minutes.json --output results/nba/prospective/pipeline_readiness.json --summary results/nba/prospective/pipeline_readiness.md
          cat results/nba/prospective/pipeline_readiness.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve official NBA injury report PDF extraction or explicit unavailability
        if: ${{ hashFiles('results/nba/prospective/snapshot.json') != '' }}
        run: |
          python nba/official_injury_pdf.py --snapshot results/nba/prospective/snapshot.json --output results/nba/prospective/official_injury_source.json
      - name: Collect per-game ESPN preview observations
        if: ${{ hashFiles('results/nba/prospective/snapshot.json') != '' }}
        continue-on-error: true
        run: |
          python nba/game_preview.py --snapshot results/nba/prospective/snapshot.json --output results/nba/prospective/game_previews.json
      - name: Collect ESPN and Bleacher Report pregame alerts with independent provenance
        if: ${{ hashFiles('results/nba/prospective/snapshot.json') != '' }}
        run: |
          python nba/multisource_evidence.py --snapshot results/nba/prospective/snapshot.json --sporting results/nba/prospective/sporting_observations.json --preview results/nba/prospective/game_previews.json --output results/nba/prospective/multisource_evidence.json
      - name: Reconcile duplicate and conflicting NBA multi-source observations
        if: ${{ hashFiles('results/nba/prospective/multisource_evidence.json') != '' }}
        run: |
          python nba/evidence_reconciliation.py --snapshot results/nba/prospective/snapshot.json --multisource results/nba/prospective/multisource_evidence.json --output results/nba/prospective/evidence_reconciliation.json
      - name: Match BR headlines to ESPN roster identities without inventing availability
        if: ${{ hashFiles('results/nba/prospective/multisource_evidence.json') != '' }}
        run: |
          python nba/br_roster_matching.py --snapshot results/nba/prospective/snapshot.json --multisource results/nba/prospective/multisource_evidence.json --output results/nba/prospective/br_roster_matching.json
      - name: Publish NBA ESPN and BR coverage diagnostics
        if: ${{ hashFiles('results/nba/prospective/br_roster_matching.json') != '' }}
        run: |
          python nba/source_coverage_scorecard.py --snapshot results/nba/prospective/snapshot.json --multisource results/nba/prospective/multisource_evidence.json --reconciliation results/nba/prospective/evidence_reconciliation.json --matched results/nba/prospective/br_roster_matching.json --output results/nba/prospective/source_coverage_scorecard.json --summary results/nba/prospective/source_coverage_scorecard.md
          cat results/nba/prospective/source_coverage_scorecard.md >> "$GITHUB_STEP_SUMMARY"
      - name: Recover ESPN pretip summary injury observations when structured feed is empty
        if: ${{ hashFiles('results/nba/prospective/game_previews.json') != '' }}
        run: |
          python nba/availability_recovery.py --snapshot results/nba/prospective/snapshot.json --sporting results/nba/prospective/sporting_observations.json --preview results/nba/prospective/game_previews.json --output results/nba/prospective/availability_recovery.json
      - name: Archive prospective ESPN injury observations without retrospective leakage
        if: ${{ hashFiles('results/nba/prospective/snapshot.json') != '' }}
        run: |
          python nba/injury_observation_archive.py --snapshot results/nba/prospective/snapshot.json --sporting results/nba/prospective/sporting_observations.json --preview results/nba/prospective/game_previews.json --output results/nba/prospective/injury_observation_archive.json
      - name: Reconcile NBA official-injury lines and game lineup status together
        if: ${{ hashFiles('results/nba/prospective/snapshot.json') != '' }}
        run: |
          python nba/injury_lineup_joint.py --snapshot results/nba/prospective/snapshot.json --official results/nba/prospective/official_injury_source.json --preview results/nba/prospective/game_previews.json --output results/nba/prospective/injury_lineup_status.json
      - name: Mark missing full-pregame evidence explicitly
        if: ${{ hashFiles('results/nba/prospective/snapshot.json') != '' }}
        run: |
          python nba/full_pregame_gate.py --snapshot results/nba/prospective/snapshot.json --output results/nba/prospective/full_pregame_status.json
      - name: Audit both teams' roster depth and positional matchup evidence
        if: ${{ hashFiles('results/nba/prospective/snapshot.json') != '' }}
        run: |
          python nba/roster_matchups.py --snapshot results/nba/prospective/snapshot.json --output results/nba/prospective/roster_matchups.json $(test -s results/nba/prospective/sporting_observations.json && echo "--sporting-data results/nba/prospective/sporting_observations.json")
      - name: Prepare verified NBA availability feature candidates
        if: ${{ hashFiles('results/nba/prospective/snapshot.json') != '' }}
        run: |
          python nba/availability_impact.py --snapshot results/nba/prospective/snapshot.json --roster results/nba/prospective/roster_matchups.json --output results/nba/prospective/availability_features.json
      - name: Freeze pregame NBA availability for future independent validation
        if: ${{ hashFiles('results/nba/prospective/snapshot.json') != '' }}
        run: python nba/availability_ledger.py --snapshot results/nba/prospective/snapshot.json --features results/nba/prospective/availability_features.json --output results/nba/prospective/frozen_availability.json
      - name: Audit actual frozen lineup and injury coverage
        if: ${{ hashFiles('results/nba/prospective/frozen_availability.json') != '' }}
        run: python nba/availability_coverage.py --input results/nba/prospective/frozen_availability.json --output results/nba/prospective/availability_coverage.json
      - name: Diagnose actual official injury and lineup source failures
        if: ${{ hashFiles('results/nba/prospective/availability_coverage.json') != '' }}
        run: |
          python nba/source_gap_diagnostics.py --snapshot results/nba/prospective/snapshot.json --official results/nba/prospective/official_injury_source.json --preview results/nba/prospective/game_previews.json --sporting results/nba/prospective/sporting_observations.json --joint results/nba/prospective/injury_lineup_status.json --coverage results/nba/prospective/availability_coverage.json --output results/nba/prospective/source_gap_diagnostics.json
      - name: Publish observed NBA injury coverage scorecard
        if: ${{ hashFiles('results/nba/prospective/availability_coverage.json') != '' }}
        run: |
          python nba/injury_coverage_summary.py --official results/nba/prospective/official_injury_source.json --joint results/nba/prospective/injury_lineup_status.json --coverage results/nba/prospective/availability_coverage.json --output results/nba/prospective/injury_coverage_summary.json --summary results/nba/prospective/injury_coverage_summary.md
          cat results/nba/prospective/injury_coverage_summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Generate unified NBA model output
        if: ${{ hashFiles('results/nba/prospective/snapshot.json') != '' }}
        run: |
          python nba/integrated_model.py --snapshot results/nba/prospective/snapshot.json --output results/nba/prospective/integrated_model.json $(test -s results/nba/prospective/sporting_observations.json && echo "--sporting-data results/nba/prospective/sporting_observations.json")
      - name: Produce complete NBA hoy slate report
        if: ${{ hashFiles('results/nba/prospective/snapshot.json') != '' }}
        run: |
          python nba/nba_hoy.py --snapshot results/nba/prospective/snapshot.json --integrated results/nba/prospective/integrated_model.json --injury-lineups results/nba/prospective/injury_lineup_status.json --output results/nba/prospective/nba_hoy.json
      - name: Publish clearly labeled NBA baseline probabilities
        if: ${{ hashFiles('results/nba/prospective/nba_hoy.json') != '' }}
        run: python nba/preliminary_release.py --input results/nba/prospective/nba_hoy.json --output results/nba/prospective/nba_preliminary.json
      - name: Audit NBA Elo challenger and hybrid probabilities side by side
        if: ${{ hashFiles('results/nba/prospective/nba_preliminary.json') != '' }}
        run: |
          python nba/model_comparison.py --input results/nba/prospective/nba_preliminary.json --output results/nba/prospective/model_comparison.json --summary results/nba/prospective/model_comparison.md
          cat results/nba/prospective/model_comparison.md >> "$GITHUB_STEP_SUMMARY"
      - name: Render NBA predictions directly in Actions Summary and HTML
        if: ${{ hashFiles('results/nba/prospective/nba_preliminary.json') != '' }}
        run: python webresults/render.py --input results/nba/prospective/nba_preliminary.json --html results/nba/prospective/index.html --summary results/nba/prospective/summary.md
      - name: Archive predictions and provenance evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nba-automatic-pregame-${{ github.run_id }}
          path: |
            results/nba/initial_scoreboard.json
            results/nba/pregame_time_window.json
            results/nba/pregame_time_window.md
            results/nba/history_audit.json
            results/nba/feature_impact_audit.json
            results/nba/feature_impact_audit.md
            results/nba/hybrid_gate_audit.json
            results/nba/hybrid_gate_audit.md
            results/nba/player_game_history.json
            results/nba/player_history_coverage.json
            results/nba/prospective/snapshot.json
            results/nba/prospective/pregame_status.json
            results/nba/prospective/full_pregame_status.json
            results/nba/prospective/integrated_model.json
            results/nba/prospective/nba_hoy.json
            results/nba/prospective/nba_preliminary.json
            results/nba/prospective/model_comparison.json
            results/nba/prospective/model_comparison.md
            results/nba/prospective/rotation_efficiency_report.json
            results/nba/prospective/rotation_efficiency_report.md
            results/nba/prospective/joint_minutes.json
            results/nba/prospective/joint_minutes.md
            results/nba/team_boxscores.json
            results/nba/prospective/possession_intelligence.json
            results/nba/prospective/possession_intelligence.md
            results/nba/prospective/probability_score_audit.json
            results/nba/prospective/probability_score_audit.md
            results/nba/prospective/possession_challenger.json
            results/nba/prospective/possession_challenger.md
            results/nba/prospective/lineup_cascade.json
            results/nba/prospective/lineup_cascade.md
            results/nba/prospective/lineup_roster_reconciliation.json
            results/nba/prospective/lineup_roster_reconciliation.md
            results/nba/prospective/current_roster_feed.json
            results/nba/prospective/current_status_feed.json
            results/nba/prospective/active_roster_resolved.json
            results/nba/prospective/active_roster_resolved.md
            results/nba/prospective/availability_scenarios.json
            results/nba/prospective/pipeline_readiness.json
            results/nba/prospective/pipeline_readiness.md
            results/nba/prospective/lineup_source_candidates.json
            results/nba/prospective/offense_defense_matchups.json
            results/nba/prospective/offense_defense_matchups.md
            results/nba/prospective/index.html
            results/nba/prospective/summary.md
            results/nba/prospective/roster_matchups.json
            results/nba/prospective/availability_features.json
            results/nba/prospective/frozen_availability.json
            results/nba/prospective/availability_coverage.json
            results/nba/prospective/injury_coverage_summary.json
            results/nba/prospective/injury_coverage_summary.md
            results/nba/prospective/source_gap_diagnostics.json
            results/nba/prospective/game_previews.json
            results/nba/prospective/official_injury_source.json
            results/nba/prospective/injury_lineup_status.json
            results/nba/prospective/sporting_observations.json
            results/nba/prospective/multisource_evidence.json
            results/nba/prospective/evidence_reconciliation.json
            results/nba/prospective/br_roster_matching.json
            results/nba/prospective/source_coverage_scorecard.json
            results/nba/prospective/source_coverage_scorecard.md
            results/nba/prospective/availability_recovery.json
            results/nba/prospective/injury_observation_archive.json
          retention-days: 90
