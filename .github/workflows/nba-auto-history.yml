name: NBA automatic verified-history pregame
on:
  pull_request:
    paths:
      - 'nba/**'
      - '.github/workflows/nba-auto-history.yml'
  workflow_dispatch:
    inputs:
      game_date:
        description: 'NBA ESPN scoreboard date YYYY-MM-DD (US league calendar)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - run: python -m unittest discover -s nba/tests -v
  generate:
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: Validate scoreboard date and capture timestamp
        env:
          GAME_DATE: ${{ inputs.game_date }}
        run: |
          python - <<'PY'
          from datetime import date
          import os
          day=date.fromisoformat(os.environ["GAME_DATE"])
          if day.year<2026 or day.year>2027:
              raise ValueError("Game date outside supported current NBA season")
          PY
          echo "HISTORY_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Build cleaned completed NBA historical ledger
        env:
          GAME_DATE: ${{ inputs.game_date }}
        run: |
          python nba/auto_history.py --date "$GAME_DATE" --timestamp "$HISTORY_TIME" --output results/nba/history.json --workdir results/nba/raw
      - name: Generate three-model frozen pregame snapshot
        env:
          GAME_DATE: ${{ inputs.game_date }}
        run: |
          python nba/daily_pipeline.py --history results/nba/history.json --date "$GAME_DATE" --output results/nba/prospective/snapshot.json
      - name: Collect independently sourced NBA sporting observations
        id: sporting
        continue-on-error: true
        run: |
          python nba/sporting_feed.py --snapshot results/nba/prospective/snapshot.json --output results/nba/prospective/sporting_observations.json
      - name: Mark missing full-pregame evidence explicitly
        run: |
          python nba/full_pregame_gate.py --snapshot results/nba/prospective/snapshot.json --output results/nba/prospective/full_pregame_status.json
      - name: Collect per-game ESPN preview observations
        continue-on-error: true
        run: |
          python nba/game_preview.py --snapshot results/nba/prospective/snapshot.json --output results/nba/prospective/game_previews.json
      - name: Audit both teams' roster depth and positional matchup evidence
        run: |
          python nba/roster_matchups.py --snapshot results/nba/prospective/snapshot.json --output results/nba/prospective/roster_matchups.json $(test -s results/nba/prospective/sporting_observations.json && echo "--sporting-data results/nba/prospective/sporting_observations.json")
      - name: Generate unified NBA model output
        run: |
          python nba/integrated_model.py --snapshot results/nba/prospective/snapshot.json --output results/nba/prospective/integrated_model.json $(test -s results/nba/prospective/sporting_observations.json && echo "--sporting-data results/nba/prospective/sporting_observations.json")
      - name: Archive predictions and provenance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-automatic-pregame-${{ github.run_id }}
          path: |
            results/nba/history_audit.json
            results/nba/prospective/snapshot.json
            results/nba/prospective/full_pregame_status.json
            results/nba/prospective/integrated_model.json
            results/nba/prospective/roster_matchups.json
            results/nba/prospective/game_previews.json
            results/nba/prospective/sporting_observations.json
          retention-days: 90
