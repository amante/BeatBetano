name: NHL live scoreboard
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: nhl-live-scoreboard
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m nhl.live_scoreboard
      - name: Save and publish snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/data/nhl-live-scoreboard.json
          if ! git diff --cached --quiet; then
            git commit -m "Update NHL live scoreboard"
            git pull --rebase origin main
            git push origin HEAD:main
            gh workflow run pages-deploy.yml --ref main
          fi
