name: NHL — Five-season core stats ingestion
on:
  workflow_dispatch:
    inputs:
      reference_date:
        description: Date determining latest season (YYYY-MM-DD)
        required: false
        default: '2026-10-27'
        type: string
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - run: python -m unittest discover -s nhl/tests -v
      - name: Collect five NHL seasons and publish counts
        env:
          REFERENCE_DATE: ${{ inputs.reference_date }}
        run: |
          python nhl/multiseason_stats.py --date "$REFERENCE_DATE" --output results/nhl/multiseason_stats.json --summary results/nhl/multiseason_stats.md
      - name: Publish summary even on partial failure
        if: always()
        run: |
          if [ -f results/nhl/multiseason_stats.md ]; then cat results/nhl/multiseason_stats.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: nhl-five-seasons-${{ github.run_id }}
          path: |
            results/nhl/multiseason_stats.json
            results/nhl/multiseason_stats.md
          retention-days: 30
