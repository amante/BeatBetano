name: NHL — Goalie historical walk-forward benchmark
on:
  workflow_dispatch:
  pull_request:
    paths:
      - nhl/goalie_team_walkforward_184.py
      - nhl/tests/test_goalie_team_walkforward_184.py
      - .github/workflows/nhl-goalie-walkforward-184.yml
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m unittest nhl.tests.test_goalie_team_walkforward_184 -v
      - name: Download immutable goalie history and historical labels
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p results/nhl .source
          gh run download 40627704266 --repo "$GITHUB_REPOSITORY" --name nhl-official-roster-goalie-toi-40627704266 --dir results/nhl
          gh release download nhl-historical-2811-2026 --repo "$GITHUB_REPOSITORY" --pattern nhl_postgame_labels.csv --dir .source
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          folder=Path("results/nhl")
          src=folder/"individual_goalie_toi_history.json"
          manifest=json.loads((folder/"individual_goalie_toi_history_manifest.json").read_text())
          if manifest["games"]!=2811 or hashlib.sha256(src.read_bytes()).hexdigest()!=manifest["sha256"]:
            raise SystemExit("Historical goalie checksum invalid")
          PY
      - name: Walk-forward tune and previously inspected chronological test
        if: github.event_name == 'workflow_dispatch'
        run: |
          python nhl/goalie_team_walkforward_184.py --labels .source/nhl_postgame_labels.csv --history results/nhl/individual_goalie_toi_history.json --output results/nhl/goalie_walkforward_184.json
      - uses: actions/upload-artifact@v6
        if: github.event_name == 'workflow_dispatch'
        with:
          name: nhl-goalie-walkforward-184-${{ github.run_id }}
          path: results/nhl/goalie_walkforward_184.json
          retention-days: 90
