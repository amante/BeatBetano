name: PULSO NHL #229 — verified historical sporting statistics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Download archived official-source records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .nhl_archive
          gh release download nhl-historical-2811-2026 --repo "$GITHUB_REPOSITORY" \
            --pattern 'nhl-complete-2811-source.tar.gz' --pattern 'SHA256SUMS' \
            --dir .nhl_archive
          cd .nhl_archive
          # The release checksum manifest references output/<asset>; gh downloads flat.
          # Verify the original recorded hash against the downloaded basename.
          python - <<'PY'
          import hashlib
          from pathlib import Path
          rows=[x.strip().split(maxsplit=1) for x in Path('SHA256SUMS').read_text().splitlines() if x.strip()]
          matched=[digest for digest,name in rows if name.lstrip('*').removeprefix('./').endswith('/nhl-complete-2811-source.tar.gz')]
          if len(matched)!=1:raise SystemExit('Expected exactly one historical tarball checksum')
          actual=hashlib.sha256(Path('nhl-complete-2811-source.tar.gz').read_bytes()).hexdigest()
          if actual.lower()!=matched[0].lower():raise SystemExit('Historical archive checksum mismatch')
          print('Verified historical archive SHA256')
          PY
      - name: Securely extract historical match archive
        run: |
          mkdir -p .nhl_archive/games
          python - <<'PY'
          import tarfile
          path='.nhl_archive/nhl-complete-2811-source.tar.gz'
          with tarfile.open(path,'r:gz') as archive:
              members=archive.getmembers()
              from pathlib import PurePosixPath
              for m in members:
                  name=PurePosixPath(m.name)
                  if (name.is_absolute() or '..' in name.parts or
                      not (m.isdir() or m.isfile())):
                      raise SystemExit('Unsafe archive entry: '+m.name)
                  if m.isfile() and not m.name.endswith('.json'):
                      raise SystemExit('Unexpected non-JSON file: '+m.name)
              import re
              game_files=[m for m in members if m.isfile() and
                          re.fullmatch(r'[0-9]{10}\\.json', PurePosixPath(m.name).name)]
              other_json=[m.name for m in members if m.isfile() and m.name.endswith('.json') and m not in game_files]
              print('Historical TAR inventory:',len(game_files),'game-ID JSON files,',
                    len(other_json),'other JSON files; examples:',other_json[:12],flush=True)
              if len(game_files)!=2811:
                  raise SystemExit('Expected 2811 game-ID JSON records; found '+str(len(game_files)))
              archive.extractall('.nhl_archive/games',filter='data')
          PY
      - name: Compute strictly prior-date team snapshots
        run: |
          python -m nhl.prior_player_goalie_stats \
            --archive .nhl_archive/games-flat --expected 2811 \
            --output .nhl_archive/team_prior_history.json \
            --manifest .nhl_archive/team_prior_history_manifest.json
      - uses: actions/upload-artifact@v6
        with:
          name: pulso-nhl-prior-team-sporting-history
          path: |
            .nhl_archive/team_prior_history.json
            .nhl_archive/team_prior_history_manifest.json
          retention-days: 90
