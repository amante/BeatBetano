name: NHL — Core Stats and EDGE probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: Probe core NHL Stats and EDGE
        run: python nhl/edge_probe.py --output results/nhl/source_probe.json --summary results/nhl/source_probe.md
      - name: Publish evidence
        if: always()
        run: |
          if [ -f results/nhl/source_probe.md ]; then cat results/nhl/source_probe.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: nhl-source-probe-${{ github.run_id }}
          path: |
            results/nhl/source_probe.json
            results/nhl/source_probe.md
          retention-days: 7
