name: Deploy BeatBetano frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'nhl/match_context.py'
      - 'nhl/tests/test_match_context.py'
      - '.github/workflows/pages-deploy.yml'
  workflow_dispatch:
  schedule:
    - cron: '20 * * * *'
  workflow_run:
    workflows: ['PULSO NHL — prospective pregame source capture', 'NHL — daily postmortem and learning log']
    types: [completed]
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'nhl/match_context.py'
      - 'nhl/tests/test_match_context.py'
      - '.github/workflows/pages-deploy.yml'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validate frontend and daily-data collector
        run: |
          node --check frontend/app.js
          node --check frontend/portal.js
          node --check frontend/daily.js
          node --check frontend/nhl-layout.js
          node --check frontend/nhl-postmortem.js
          node --check frontend/nhl-match-context.js
          node --check frontend/nhl-goalie-comparison.js
          node --test frontend/tests/nhl-goalie-comparison.test.cjs
          node --test frontend/tests/nhl-match-context.test.cjs
          python -m unittest nhl.tests.test_match_context -v
          node --test frontend/tests/nhl-calendar.test.mjs
          node --check frontend/nhl-five-market.js
          node --test backend/tests/*.test.mjs frontend/tests/nhl-dispatch.test.cjs
          node --check frontend/nhl-plus3-average.js
          node --test frontend/tests/nhl-plus3-average.test.cjs
          node --check backend/nhl-dispatch-worker.mjs
          python -m py_compile frontend/collect_daily.py frontend/merge_daily_history.py
          python -m unittest discover -s frontend/tests -v
          test -s frontend/index.html
          test -s frontend/dashboard.html
          test -s frontend/styles.css
          test -s frontend/portal.css
          test -s frontend/daily.css
      - name: Check frontend links and deployment content
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          root=Path('frontend')
          class RefScanner(HTMLParser):
              def __init__(self):
                  super().__init__();self.refs=[]
              def handle_starttag(self,tag,attrs):
                  data=dict(attrs)
                  for key in ('src','href'):
                      value=data.get(key,'')
                      if value.startswith('./') and not value.startswith('./#'):
                          self.refs.append(value.split('?',1)[0].split('#',1)[0])
          for page in ('index.html','dashboard.html'):
              parser=RefScanner()
              parser.feed((root/page).read_text())
              for ref in parser.refs:
                  if not (root/ref).is_file():
                      raise SystemExit(f'Missing {page} reference: {ref}')
          print('Frontend assets and entrypoints verified')
          PY

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository))
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Refresh public NHL calendar (yesterday through seven days ahead)
        run: node frontend/collect-nhl-schedule.mjs
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Refresh official NHL match context
        run: python -m nhl.match_context
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload frontend (only public, static files)
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
