name: Deploy BeatBetano frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/pages-deploy.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/pages-deploy.yml'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validate frontend and daily-data collector
        run: |
          node --check frontend/app.js
          node --check frontend/portal.js
          node --check frontend/daily.js
          python -m py_compile frontend/collect_daily.py frontend/merge_daily_history.py
          python -m unittest discover -s frontend/tests -v
          test -s frontend/index.html
          test -s frontend/dashboard.html
          test -s frontend/styles.css
          test -s frontend/portal.css
          test -s frontend/daily.css
      - name: Check frontend links and deployment content
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          root=Path('frontend')
          class RefScanner(HTMLParser):
              def __init__(self):
                  super().__init__();self.refs=[]
              def handle_starttag(self,tag,attrs):
                  data=dict(attrs)
                  for key in ('src','href'):
                      value=data.get(key,'')
                      if value.startswith('./') and not value.startswith('./#'):
                          self.refs.append(value.split('?',1)[0].split('#',1)[0])
          for page in ('index.html','dashboard.html'):
              parser=RefScanner()
              parser.feed((root/page).read_text())
              for ref in parser.refs:
                  if not (root/ref).is_file():
                      raise SystemExit(f'Missing {page} reference: {ref}')
          print('Frontend assets and entrypoints verified')
          PY

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload frontend (only public, static files)
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
