name: NHL — Pregame fixture and goalie verification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - nhl/pregame_fixture_goalie_verifier.py
      - nhl/tests/test_pregame_fixture_goalie_verifier.py
      - .github/workflows/nhl-pregame-verification.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m unittest nhl.tests.test_pregame_fixture_goalie_verifier -v
