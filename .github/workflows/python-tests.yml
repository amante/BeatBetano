name: Validate Python modules
on:
  push:
    branches: [main, feature/sports-model-validation-mvp]
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check syntax and NHL integrated model
        run: |
          python -m py_compile validation/backtest.py nhl/joint_match_engine_320.py nhl/joint_match_input_builder_321.py
          python -m unittest nhl.tests.test_joint_match_engine_320 nhl.tests.test_joint_match_input_builder_321 -v
