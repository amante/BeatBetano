name: Validate Python modules
on:
  push:
    branches: [main, feature/sports-model-validation-mvp]
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check syntax
        run: python -m py_compile validation/backtest.py
