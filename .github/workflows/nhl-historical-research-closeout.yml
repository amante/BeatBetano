name: NHL — Historical research final closeout all targets
on:
  workflow_dispatch:
  pull_request:
    paths:
      - nhl/historical_research_closeout.py
      - nhl/tests/test_historical_research_closeout.py
      - .github/workflows/nhl-historical-research-closeout.yml
permissions:
  contents: read
  actions: read
jobs:
  closeout:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - run: python -m unittest nhl.tests.test_historical_research_closeout nhl.tests.test_rolling_goalie_features nhl.tests.test_season_phase_goalie_audit -v
      - name: Retrieve source releases and previous-date evidence
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .source/archive .source/labels .source/prior results/nhl
          gh release download nhl-historical-2811-2026 --repo "$GITHUB_REPOSITORY" \
            --pattern nhl-complete-2811-source.tar.gz --pattern archive_sha256.json --dir .source
          gh release download nhl-historical-2811-2026 --repo "$GITHUB_REPOSITORY" \
            --pattern nhl_postgame_labels.csv --pattern labels_manifest.json --dir .source/labels
          gh run download 40622612674 --repo "$GITHUB_REPOSITORY" \
            --name nhl-prior-player-goalie-stats-40622612674 --dir .source/prior
          tar -xzf .source/nhl-complete-2811-source.tar.gz -C .source/archive
      - name: Verify audited source, labels and previous-date metric hashes
        if: github.event_name == 'workflow_dispatch'
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          archive=Path(".source/archive")
          hashes=json.loads(Path(".source/archive_sha256.json").read_text())
          if len([x for x in hashes if x!="manifest.json"])!=2811:raise SystemExit("Incomplete historical archive")
          for name,sha in hashes.items():
            if Path(name).name!=name or not (archive/name).exists() or hashlib.sha256((archive/name).read_bytes()).hexdigest()!=sha:
              raise SystemExit("Source archive checksum mismatch: "+name)
          labels=Path(".source/labels/nhl_postgame_labels.csv")
          m=json.loads(Path(".source/labels/labels_manifest.json").read_text())
          if m["games"]!=2811 or hashlib.sha256(labels.read_bytes()).hexdigest()!=m["sha256"]:
            raise SystemExit("Labels checksum mismatch")
          prior=Path(".source/prior/prior_player_goalie_stats.json")
          p=json.loads(Path(".source/prior/prior_player_goalie_stats_manifest.json").read_text())
          if p["games"]!=2811 or hashlib.sha256(prior.read_bytes()).hexdigest()!=p["sha256"]:
            raise SystemExit("Prior features checksum mismatch")
          PY
      - name: Rebuild rolling features and complete all historical targets
        if: github.event_name == 'workflow_dispatch'
        run: |
          python nhl/rolling_goalie_features.py \
            --archive .source/archive \
            --output results/nhl/rolling_goalie_features.json \
            --manifest results/nhl/rolling_goalie_features_manifest.json
          python nhl/historical_research_closeout.py \
            --labels .source/labels/nhl_postgame_labels.csv \
            --prior .source/prior/prior_player_goalie_stats.json \
            --rolling results/nhl/rolling_goalie_features.json \
            --output results/nhl/historical_research_closeout.json
      - uses: actions/upload-artifact@v6
        if: github.event_name == 'workflow_dispatch'
        with:
          name: nhl-historical-research-closeout-${{ github.run_id }}
          path: results/nhl/*.json
          retention-days: 90
