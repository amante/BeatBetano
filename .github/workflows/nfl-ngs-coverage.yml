name: NFL NGS 2016-2025 data and leakage audit
on:
  pull_request:
    paths: ['validation/**','.github/workflows/nfl-ngs-coverage.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ngs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r validation/requirements.txt
      - run: python -m unittest discover -s validation/tests -v
      - name: Fetch and audit real nflverse NGS 2016-2025
        run: python validation/ngs_weekly.py --output results/ngs --last-season 2025
      - uses: actions/upload-artifact@v4
        with:
          name: nfl-ngs-audit-2016-2025
          path: results/ngs/coverage.json
          retention-days: 30
