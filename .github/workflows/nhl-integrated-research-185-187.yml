name: NHL — Integrated CRS context and probabilistic research
on:
  workflow_dispatch:
  pull_request:
    paths:
      - nhl/integrated_pregame_research_185_187.py
      - nhl/tests/test_integrated_pregame_research_185_187.py
      - .github/workflows/nhl-integrated-research-185-187.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Regression and research integration tests
        run: |
          python -m unittest nhl.tests.test_integrated_pregame_research_185_187 -v
          python -m unittest nhl.tests.test_goalie_daily_evidence nhl.tests.test_goalie_real_data_audit nhl.tests.test_goalie_team_walkforward_184 -v
