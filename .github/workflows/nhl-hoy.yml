name: NHL hoy — preliminary pregame slate
on:
  workflow_dispatch:
    inputs:
      game_date:
        description: 'NHL calendar date YYYY-MM-DD'
        required: true
        type: string
  pull_request:
    paths:
      - 'nhl/**'
      - '.github/workflows/nhl-hoy.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - run: python -m unittest discover -s nhl/tests -v
      - run: python -m unittest discover -s webresults/tests -v
      - run: python -m unittest discover -s multisport/tests -v
  generate:
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: Run all future NHL matchups with yesterday's standings
        env:
          GAME_DATE: ${{ inputs.game_date }}
        run: python nhl/nhl_hoy.py --date "$GAME_DATE" --output results/nhl/nhl_hoy.json
      - name: Restore existing current-season NHL snapshot
        id: snapshot
        uses: actions/cache/restore@v4
        with:
          path: results/nhl/cache/current_snapshot.json
          key: nhl-current-20262027-pregame-${{ github.run_id }}
          restore-keys: |
            nhl-current-20262027-
      - name: Reuse cached season data for every pregame matchup
        if: steps.snapshot.outputs.cache-hit != ''
        run: |
          python nhl/pregame_snapshot.py --slate results/nhl/nhl_hoy.json --snapshot results/nhl/cache/current_snapshot.json --output results/nhl/pregame_snapshot.json --summary results/nhl/pregame_snapshot.md
          cat results/nhl/pregame_snapshot.md >> "$GITHUB_STEP_SUMMARY"
      - name: Report missing cached current-season evidence
        if: steps.snapshot.outputs.cache-hit == ''
        run: echo "NHL current-season snapshot not cached; run the incremental workflow first." >> "$GITHUB_STEP_SUMMARY"
      - name: Collect NHL goalie roster candidates and recent official game logs
        run: python nhl/goalie_feed.py --slate results/nhl/nhl_hoy.json --output results/nhl/goalie_candidates.json
      - name: Integrate goalie observations into pregame evidence
        run: |
          python nhl/goalie_observations.py --slate results/nhl/nhl_hoy.json --candidates results/nhl/goalie_candidates.json --output results/nhl/goalie_observations.json --summary results/nhl/goalie_coverage.md
          cat results/nhl/goalie_coverage.md >> "$GITHUB_STEP_SUMMARY"
      - name: Freeze NHL pregame forecast and goalie evidence for future backtesting
        run: python nhl/frozen_ledger.py --slate results/nhl/nhl_hoy.json --goalies results/nhl/goalie_observations.json --output results/nhl/frozen_pregame.json
      - name: Render NHL predictions directly in Actions Summary and HTML
        run: python webresults/render.py --input results/nhl/nhl_hoy.json --html results/nhl/index.html --summary results/nhl/summary.md
      - name: Audit all ten NHL modules and display coverage in Actions Summary
        run: |
          python nhl/module_audit.py --slate results/nhl/nhl_hoy.json --goalies results/nhl/goalie_observations.json --snapshot results/nhl/pregame_snapshot.json --output results/nhl/module_audit.json --summary results/nhl/module_audit.md
          cat results/nhl/module_audit.md >> "$GITHUB_STEP_SUMMARY"
      - name: Render real snapshot evidence for all 11 matchups
        run: |
          if [ ! -f results/nhl/pregame_snapshot.json ]; then echo 'No cached NHL current-season evidence' >&2; exit 1; fi
          python nhl/pregame_reporting.py --input results/nhl/pregame_snapshot.json --summary results/nhl/verified_evidence.md
          cat results/nhl/verified_evidence.md >> "$GITHUB_STEP_SUMMARY"
      - name: Calculate transparent NHL goal-process exploratory estimates
        run: |
          python nhl/goal_process.py --input results/nhl/pregame_snapshot.json --output results/nhl/goal_process.json --summary results/nhl/goal_process.md
          cat results/nhl/goal_process.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: nhl-hoy-${{ github.run_id }}
          path: |
            results/nhl/nhl_hoy.json
            results/nhl/pregame_snapshot.json
            results/nhl/pregame_snapshot.md
            results/nhl/goalie_candidates.json
            results/nhl/goalie_observations.json
            results/nhl/goalie_coverage.md
            results/nhl/frozen_pregame.json
            results/nhl/index.html
            results/nhl/summary.md
            results/nhl/module_audit.json
            results/nhl/module_audit.md
            results/nhl/four_pillars.json
            results/nhl/four_pillars.md
            results/nhl/real_players.json
            results/nhl/verified_evidence.md
            results/nhl/goal_process.json
            results/nhl/goal_process.md
          retention-days: 30
