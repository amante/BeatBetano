name: NHL hoy — preliminary pregame slate
on:
  workflow_dispatch:
    inputs:
      game_date:
        description: 'NHL calendar date YYYY-MM-DD'
        required: true
        type: string
  pull_request:
    paths:
      - 'nhl/**'
      - '.github/workflows/nhl-hoy.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - run: python -m unittest discover -s nhl/tests -v
  generate:
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: Run all future NHL matchups with yesterday's standings
        env:
          GAME_DATE: ${{ inputs.game_date }}
        run: python nhl/nhl_hoy.py --date "$GAME_DATE" --output results/nhl/nhl_hoy.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: nhl-hoy-${{ github.run_id }}
          path: results/nhl/nhl_hoy.json
          retention-days: 30
