name: NBA PULSO — dispatch verified auto-history pregame
on:
  workflow_dispatch:
    inputs:
      game_date:
        description: 'NBA scoreboard date YYYY-MM-DD (US league calendar)'
        required: true
        type: string
      history_run_id:
        description: 'Optional successful NBA prepare-history run ID; leave blank to build history in this run'
        required: false
        type: string
      official_injury_report_url:
        description: 'Optional direct NBA-hosted injury PDF URL if the official index is unavailable'
        required: false
        type: string
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate inputs and dispatch the self-building NBA PULSO workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_DATE: ${{ inputs.game_date }}
          HISTORY_RUN_ID: ${{ inputs.history_run_id }}
          OFFICIAL_INJURY_REPORT_URL: ${{ inputs.official_injury_report_url }}
        run: |
          python - <<'PY'
          import os
          from datetime import date
          day = date.fromisoformat(os.environ["GAME_DATE"])
          if day.year not in (2026, 2027):
              raise ValueError("Game date is outside the supported NBA season")
          run_id = os.environ.get("HISTORY_RUN_ID", "").strip()
          if run_id and not run_id.isdigit():
              raise ValueError("history_run_id must contain digits only")
          url = os.environ.get("OFFICIAL_INJURY_REPORT_URL", "").strip()
          if url and not url.startswith("https://"):
              raise ValueError("official injury report URL must use HTTPS")
          PY

          args=(--repo amante/BeatBetano --ref main -f "game_date=$GAME_DATE")
          if [ -n "$HISTORY_RUN_ID" ]; then
            args+=(-f "history_run_id=$HISTORY_RUN_ID")
          fi
          if [ -n "$OFFICIAL_INJURY_REPORT_URL" ]; then
            args+=(-f "official_injury_report_url=$OFFICIAL_INJURY_REPORT_URL")
          fi

          gh workflow run nba-auto-history.yml "${args[@]}"
          {
            echo "## NBA PULSO pregame dispatched"
            echo
            echo "Date: $GAME_DATE"
            echo
            echo "The self-building workflow creates and audits the verified history, collects injury evidence from the official and complementary sources, excludes games that have already started, and publishes only the eligible pregame snapshot."
            echo
            echo "[Open the NBA automatic verified-history workflow](https://github.com/amante/BeatBetano/actions/workflows/nba-auto-history.yml)"
          } >> "$GITHUB_STEP_SUMMARY"
