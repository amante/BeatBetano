name: NHL — Historical ML walk-forward calibration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: Validate chronological model and leakage guards
        run: python -m unittest discover -s nhl/tests -v
      - name: Train on 2024-25 and evaluate 2025-26 onward
        run: |
          python nhl/walkforward_calibration.py --start 2024-10-01 --end 2026-10-26 --train-through 2025-06-30 --test-from 2025-10-01 --output results/nhl/walkforward_calibration.json --summary results/nhl/walkforward_calibration.md
          cat results/nhl/walkforward_calibration.md >> "$GITHUB_STEP_SUMMARY"
      - name: Compare frozen ML candidate to goal-only proxy on same historical holdout
        run: |
          python nhl/ml_candidate_compare.py --history results/nhl/walkforward_history.json --output results/nhl/ml_candidate_compare.json --summary results/nhl/ml_candidate_compare.md
          cat results/nhl/ml_candidate_compare.md >> "$GITHUB_STEP_SUMMARY"
      - name: ML v2 strict tune/test evaluation
        run: |
          python nhl/ml_v2_validation.py --history results/nhl/walkforward_history.json --output results/nhl/ml_v2_validation.json --summary results/nhl/ml_v2_validation.md
          cat results/nhl/ml_v2_validation.md >> "$GITHUB_STEP_SUMMARY"
      - name: Audit NHL modules historical evidence readiness
        run: python nhl/module_validation_readiness.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: nhl-walkforward-${{ github.run_id }}
          path: |
            results/nhl/walkforward_calibration.*
            results/nhl/walkforward_history.json
            results/nhl/ml_candidate_compare.*
            results/nhl/ml_v2_validation.*
            results/nhl/module_validation_readiness.json
            results/nhl/historical_fetch_errors.json
          retention-days: 30
