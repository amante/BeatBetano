name: PULSO NHL #216 — prospective evidence reconciliation
on:
  pull_request:
    paths:
      - nhl/pulso_prospective_reconcile_216.py
      - nhl/tests/test_pulso_prospective_reconcile_216.py
      - .github/workflows/pulso-prospective-reconcile-216.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m unittest nhl.tests.test_pulso_prospective_reconcile_216 -v
