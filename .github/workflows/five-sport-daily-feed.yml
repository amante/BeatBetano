name: Five-sport daily fixtures and results
on:
  schedule:
    - cron: '15 9 * * *'
    - cron: '15 21 * * *'
  workflow_dispatch:
    inputs:
      nba_injury_report_url:
        description: 'Optional direct URL to the latest NBA-hosted injury report PDF'
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: daily-forecast-publication
  cancel-in-progress: false
jobs:
  refresh:
    env:
      NBA_OFFICIAL_INJURY_REPORT_URL: ${{ inputs.nba_injury_report_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install requests pypdf
      - name: Restore incremental model data (never forecast history)
        uses: actions/cache@v4
        with:
          path: results/daily-models/cache
          key: daily-model-data-${{ github.run_id }}
          restore-keys: daily-model-data-
      - name: Retrieve today's and yesterday's verified fixtures
        run: python frontend/collect_daily.py --out frontend/data/daily.json
      - name: Generate initial or updated forecasts independently for every sport
        run: |
          python -m multisport.daily_pipeline \
            --fixtures frontend/data/daily.json \
            --archive frontend/data/forecast_archive \
            --workdir results/daily-models \
            --summary frontend/data/forecast_status.json
      - name: Maintain chronological outcomes archive
        run: python frontend/merge_daily_history.py --daily frontend/data/daily.json --history frontend/data/history.json
      - name: Score sealed pregame forecasts against final results
        run: |
          python -m multisport.forecast_evaluation \
            --archive frontend/data/forecast_archive \
            --history frontend/data/history.json \
            --output frontend/data/forecast-evaluation-latest.json
      - name: Publish certification readiness by model version
        run: |
          python -m multisport.certification_readiness \
            --evaluation frontend/data/forecast-evaluation-latest.json \
            --evidence-dir frontend/data/certification-evidence \
            --output frontend/data/certification-readiness-latest.json
      - name: Archive and evaluate paired NBA research forecasts
        run: |
          python nba/livedata_forward_evaluation.py \
            --workdir results/daily-models \
            --archive frontend/data/nba-livedata-forward \
            --outcomes frontend/data/history.json \
            --summary frontend/data/nba-livedata-evaluation.json
      - name: Publish NBA rotation research when pregame inputs are available
        continue-on-error: true
        timeout-minutes: 6
        run: |
          python -m pip install pbpstats==1.3.11
          python nba/daily_rotation_path.py \
            --workdir results/daily-models \
            --archive frontend/data/nba-rotation-archive \
            --latest frontend/data/nba-rotation-latest.json \
            --daily-feed frontend/data/daily.json \
            --source-status frontend/data/forecast_status.json
      - name: Archive model outputs and source-failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-model-outputs-${{ github.run_id }}
          path: |
            results/daily-models/*.json
            results/daily-models/nba-*.availability/*.json
            results/daily-models/nba-*.team-metrics/*.json
            results/daily-models/nba-*.possessions/*.json
            results/daily-models/nba-*.possessions/pbp/*.json
            frontend/data/nba-rotation-latest.json
            frontend/data/forecast_status.json
            frontend/data/nba-livedata-evaluation.json
            frontend/data/forecast_archive
            frontend/data/forecast-evaluation-latest.json
          retention-days: 90
      - name: Validate JSON output
        run: |
          python -m json.tool frontend/data/daily.json > /dev/null
          python -m json.tool frontend/data/history.json > /dev/null
          python -m json.tool frontend/data/forecast-evaluation-latest.json > /dev/null
      - name: Save snapshot to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/data/daily.json frontend/data/history.json frontend/data/forecast_status.json frontend/data/forecast_archive
          git add frontend/data/forecast-evaluation-latest.json
          git add frontend/data/nba-livedata-evaluation.json
          if compgen -G 'frontend/data/nba-livedata-forward/*.json' > /dev/null; then
            git add frontend/data/nba-livedata-forward
          fi
          if test -f frontend/data/nba-rotation-latest.json; then
            git add frontend/data/nba-rotation-latest.json frontend/data/nba-rotation-archive
          fi
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh five-sport fixtures and settled results"
            git push origin HEAD:main
          fi
