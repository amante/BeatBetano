name: NHL — Sourced pregame roster adapter tests
on:
  pull_request:
    paths:
      - nhl/roster_source_adapter.py
      - nhl/tests/test_roster_source_adapter.py
      - .github/workflows/nhl-roster-source-adapter.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m unittest nhl.tests.test_roster_source_adapter nhl.tests.test_quantitative_roster_delta -v
