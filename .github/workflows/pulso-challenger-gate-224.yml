name: PULSO NHL #224 — challenger chronological gate
on:
  pull_request:
    paths:
      - nhl/pulso_challenger_gate_224.py
      - nhl/tests/test_pulso_challenger_gate_224.py
      - .github/workflows/pulso-challenger-gate-224.yml
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m unittest nhl.tests.test_pulso_challenger_gate_224 -v
