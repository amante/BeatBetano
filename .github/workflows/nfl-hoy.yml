name: NFL hoy — odds-free prospective slate
on:
  workflow_dispatch:
    inputs:
      game_date:
        description: 'NFL league date YYYY-MM-DD'
        required: true
        type: string
  pull_request:
    paths:
      - 'nfl/**'
      - '.github/workflows/nfl-hoy.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s nfl/tests -v
  generate:
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r validation/requirements.txt
      - name: Download real NFL historical league games
        run: python validation/backtest.py fetch-nfl --output data/nfl_games.csv
      - name: Produce all eligible NFL pregame matchups
        env:
          GAME_DATE: ${{ inputs.game_date }}
        run: python nfl/nfl_hoy.py --date "$GAME_DATE" --history data/nfl_games.csv --output results/nfl/nfl_hoy.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: nfl-hoy-${{ github.run_id }}
          path: results/nfl/nfl_hoy.json
          retention-days: 30
