name: NFL hoy — odds-free prospective slate
on:
  workflow_dispatch:
    inputs:
      game_date:
        description: 'NFL league date YYYY-MM-DD'
        required: true
        type: string
  pull_request:
    paths:
      - 'multisport/**'
      - 'nfl/**'
      - '.github/workflows/nfl-hoy.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - run: python -m unittest discover -s nfl/tests -v
  generate:
    permissions:
      contents: write
    concurrency:
      group: daily-forecast-publication
      cancel-in-progress: false
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r validation/requirements.txt
      - name: Download real NFL historical league games
        run: python validation/backtest.py fetch-nfl --output data/nfl_games.csv
      - name: Produce all eligible NFL pregame matchups
        env:
          GAME_DATE: ${{ inputs.game_date }}
        run: python nfl/nfl_hoy.py --date "$GAME_DATE" --history data/nfl_games.csv --output results/nfl/nfl_hoy.json --forecast-archive frontend/data/forecast_archive
      - name: Preserve NFL initial and updated predictions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p frontend/data/forecast_archive
          git add frontend/data/forecast_archive
          if ! git diff --cached --quiet; then
            git commit -m "data: preserve NFL pregame forecast revisions"
            git push origin HEAD:main
          fi
      - name: Collect timestamped NFL injury/matchup observations
        run: python nfl/pregame_evidence.py --slate results/nfl/nfl_hoy.json --output results/nfl/pregame_evidence.json
      - name: Reconcile verified NFL availability, secondary and weather inputs
        run: python nfl/matchup_reconciliation.py --slate results/nfl/nfl_hoy.json --supplement results/nfl/pregame_evidence.json --output results/nfl/matchup_verified.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: nfl-hoy-${{ github.run_id }}
          path: |
            results/nfl/nfl_hoy.json
            results/nfl/nfl_hoy.forecasts.json
            frontend/data/forecast_archive
            results/nfl/pregame_evidence.json
            results/nfl/matchup_verified.json
          retention-days: 30
