name: NBA model official candidate tests
on:
  pull_request:
    paths:
      - 'nba/**'
      - '.github/workflows/nba-model-tests.yml'
  push:
    branches: [main]
    paths:
      - 'nba/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nba-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - run: python -m unittest discover -s nba/tests -v
