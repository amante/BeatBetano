name: NBA prospective daily postmortem
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Successful pregame run ID containing nba-automatic-pregame artifact'
        required: false
        type: string
  schedule:
    - cron: '30 14 * * *'
permissions:
  contents: read
  actions: read
jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      MANUAL_SOURCE_RUN: ${{ inputs.source_run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - run: python -m unittest discover -s nba/tests -v
      - name: Locate latest valid pregame snapshot artifact
        run: |
          mkdir -p results/nba/settlement/input
          python - <<'PY'
          import json,os,subprocess
          repo=os.environ["GITHUB_REPOSITORY"]
          manual=os.environ.get("MANUAL_SOURCE_RUN","").strip()
          if manual and not manual.isdigit():raise ValueError("Source run ID must be numeric")
          if manual:
              ids=[int(manual)]
          else:
              data=json.loads(subprocess.check_output(["gh","api",f"repos/{repo}/actions/workflows/nba-auto-history.yml/runs","-f","per_page=30","-f","event=workflow_dispatch","--method","GET"],text=True))
              ids=[r["id"] for r in data["workflow_runs"] if r["status"]=="completed" and r["conclusion"]=="success" and r["head_branch"]=="main"]
          chosen=None\n          artifact_id=None
          for rid in ids:
              payload=json.loads(subprocess.check_output(["gh","api",f"repos/{repo}/actions/runs/{rid}/artifacts"],text=True))
              matches=[a for a in payload["artifacts"] if a["name"]==f"nba-automatic-pregame-{rid}" and not a["expired"]]
              if matches:
                  chosen=rid
                  break
          if chosen is None:raise ValueError("No eligible archived pregame predictions")
          with open(os.environ["GITHUB_ENV"],"a") as f:f.write(f"PREGAME_RUN={chosen}\n")
          print(f"Selected immutable prediction artifact from run {chosen}")
          PY
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/nba-pregame.zip\n          unzip -q /tmp/nba-pregame.zip -d results/nba/settlement/input\n          test -s results/nba/settlement/input/prospective/snapshot.json
      - name: Settle against current source results without modifying snapshot
        run: |
          test -s results/nba/settlement/input/prospective/snapshot.json
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python nba/settle_daily.py --snapshot results/nba/settlement/input/prospective/snapshot.json --as-of "$NOW" --output results/nba/settlement/postmortem.json
      - name: Preserve independent postmortem
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-postmortem-${{ github.run_id }}
          path: results/nba/settlement/postmortem.json
          retention-days: 90
