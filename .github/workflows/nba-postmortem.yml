name: NBA prospective daily postmortem
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Successful pregame run ID containing nba-automatic-pregame artifact'
        required: false
        type: string
  schedule:
    - cron: '30 14 * * *'
permissions:
  contents: write
  actions: read
jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      MANUAL_SOURCE_RUN: ${{ inputs.source_run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - run: python -m unittest discover -s nba/tests -v
      - name: Locate latest valid pregame snapshot artifact
        run: |
          mkdir -p results/nba/settlement/input
          python - <<'PY'
          import json,os,subprocess
          repo=os.environ["GITHUB_REPOSITORY"]
          manual=os.environ.get("MANUAL_SOURCE_RUN","").strip()
          if manual and not manual.isdigit():raise ValueError("Source run ID must be numeric")
          if manual:
              ids=[int(manual)]
          else:
              data=json.loads(subprocess.check_output(["gh","api",f"repos/{repo}/actions/workflows/nba-auto-history.yml/runs","-f","per_page=30","-f","event=workflow_dispatch","--method","GET"],text=True))
              ids=[r["id"] for r in data["workflow_runs"] if r["status"]=="completed" and r["conclusion"]=="success" and r["head_branch"]=="main"]
          chosen=None
          artifact_id=None
          for rid in ids:
              payload=json.loads(subprocess.check_output(["gh","api",f"repos/{repo}/actions/runs/{rid}/artifacts"],text=True))
              matches=[a for a in payload["artifacts"] if a["name"]==f"nba-automatic-pregame-{rid}" and not a["expired"]]
              if matches:
                  chosen=rid
                  artifact_id=matches[0]["id"]
                  break
          if chosen is None:raise ValueError("No eligible archived pregame predictions")
          with open(os.environ["GITHUB_ENV"],"a") as f:f.write(f"PREGAME_RUN={chosen}\nARTIFACT_ID={artifact_id}\n")
          print(f"Selected immutable prediction artifact from run {chosen}")
          PY
      - name: Download immutable pregame artifact from selected run
        uses: actions/download-artifact@v4
        with:
          name: nba-automatic-pregame-${{ env.PREGAME_RUN }}
          run-id: ${{ env.PREGAME_RUN }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: results/nba/settlement/input
      - name: Validate downloaded archive
        run: |
          find results/nba/settlement/input -maxdepth 4 -type f -print
          test -s results/nba/settlement/input/prospective/snapshot.json
      - name: Settle against current source results without modifying snapshot
        run: |
          test -s results/nba/settlement/input/prospective/snapshot.json
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python nba/settle_daily.py --snapshot results/nba/settlement/input/prospective/snapshot.json --as-of "$NOW" --output results/nba/settlement/postmortem.json
      - name: Fetch completed player participation for the frozen slate
        id: settled_fixtures
        if: ${{ hashFiles('results/nba/settlement/input/prospective/injury_status_observations.json') != '' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          snapshot=json.loads(Path("results/nba/settlement/input/prospective/snapshot_module_freeze.json").read_text())
          settled=json.loads(Path("results/nba/settlement/postmortem.json").read_text())
          final_ids={str(row["game_id"]) for row in settled.get("games",[])}
          fixtures=[{key:row[key] for key in ("game_id","home_team","away_team","tipoff_utc")}
                    for row in snapshot.get("predictions",[]) if str(row["game_id"]) in final_ids]
          Path("results/nba/settlement/settled_fixtures.json").write_text(json.dumps(fixtures,indent=2))
          with open(os.environ["GITHUB_OUTPUT"],"a") as output:
              output.write("has_games="+("true" if fixtures else "false")+"\\n")
          print("Completed fixtures with player boxscores:",len(fixtures))
          PY
      - name: Fetch ESPN player boxscores for completed fixtures
        if: ${{ steps.settled_fixtures.outputs.has_games == 'true' }}
        run: |
          python nba/player_game_history.py --history results/nba/settlement/settled_fixtures.json --output results/nba/settlement/player_boxscores.json
      - name: Join pregame injury states to actual player participation
        if: ${{ steps.settled_fixtures.outputs.has_games == 'true' && hashFiles('results/nba/settlement/input/prospective/injury_status_observations.json') != '' && hashFiles('results/nba/settlement/player_boxscores.json') != '' }}
        run: |
          python nba/injury_status_calibration.py settle --capture results/nba/settlement/input/prospective/injury_status_observations.json --boxscores results/nba/settlement/player_boxscores.json --output results/nba/settlement/injury_status_settlement.json
      - name: Preserve prospective injury status evidence and publish observed rates
        if: ${{ hashFiles('results/nba/settlement/injury_status_settlement.json') != '' }}
        env:
          SOURCE_RUN: ${{ env.PREGAME_RUN }}
        run: |
          mkdir -p nba/learning/injury_status/captures nba/learning/injury_status/settlements
          cp results/nba/settlement/input/prospective/injury_status_observations.json "nba/learning/injury_status/captures/run-${SOURCE_RUN}.json"
          cp results/nba/settlement/injury_status_settlement.json "nba/learning/injury_status/settlements/run-${SOURCE_RUN}.json"
          python nba/injury_status_calibration.py summarize --settlements nba/learning/injury_status/settlements --output frontend/data/nba-injury-status-calibration-latest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "nba/learning/injury_status/captures/run-${SOURCE_RUN}.json" "nba/learning/injury_status/settlements/run-${SOURCE_RUN}.json" frontend/data/nba-injury-status-calibration-latest.json
          if ! git diff --cached --quiet; then git commit -m 'data(nba): settle pregame injury status observations'; fi
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Preserve independent postmortem
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-postmortem-${{ github.run_id }}
          path: results/nba/settlement/postmortem.json
          retention-days: 90
