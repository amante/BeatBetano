name: NBA prospective daily postmortem
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Successful pregame run ID containing nba-automatic-pregame artifact'
        required: false
        type: string
  schedule:
    - cron: '30 14 * * *'
permissions:
  contents: write
  actions: read
jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      MANUAL_SOURCE_RUN: ${{ inputs.source_run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - run: python -m unittest discover -s nba/tests -v
      - name: Locate latest valid pregame snapshot artifact
        run: |
          mkdir -p results/nba/settlement/input
          python - <<'PY'
          import json,os,subprocess
          repo=os.environ["GITHUB_REPOSITORY"]
          manual=os.environ.get("MANUAL_SOURCE_RUN","").strip()
          if manual and not manual.isdigit():raise ValueError("Source run ID must be numeric")
          if manual:
              ids=[int(manual)]
          else:
              data=json.loads(subprocess.check_output(["gh","api",f"repos/{repo}/actions/workflows/nba-auto-history.yml/runs","-f","per_page=30","-f","event=workflow_dispatch","--method","GET"],text=True))
              ids=[r["id"] for r in data["workflow_runs"] if r["status"]=="completed" and r["conclusion"]=="success" and r["head_branch"]=="main"]
          chosen=None
          artifact_id=None
          for rid in ids:
              payload=json.loads(subprocess.check_output(["gh","api",f"repos/{repo}/actions/runs/{rid}/artifacts"],text=True))
              matches=[a for a in payload["artifacts"] if a["name"]==f"nba-automatic-pregame-{rid}" and not a["expired"]]
              if matches:
                  chosen=rid
                  artifact_id=matches[0]["id"]
                  break
          if chosen is None:raise ValueError("No eligible archived pregame predictions")
          with open(os.environ["GITHUB_ENV"],"a") as f:f.write(f"PREGAME_RUN={chosen}\nARTIFACT_ID={artifact_id}\n")
          print(f"Selected immutable prediction artifact from run {chosen}")
          PY
      - name: Download immutable pregame artifact from selected run
        uses: actions/download-artifact@v4
        with:
          name: nba-automatic-pregame-${{ env.PREGAME_RUN }}
          run-id: ${{ env.PREGAME_RUN }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: results/nba/settlement/input
      - name: Validate downloaded archive
        run: |
          find results/nba/settlement/input -maxdepth 4 -type f -print
          test -s results/nba/settlement/input/prospective/snapshot.json
      - name: Settle against current source results without modifying snapshot
        run: |
          test -s results/nba/settlement/input/prospective/snapshot.json
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python nba/settle_daily.py --snapshot results/nba/settlement/input/prospective/snapshot.json --as-of "$NOW" --output results/nba/settlement/postmortem.json
      - name: Measure prospective team confidence against completed results
        env:
          AUDIT_RUN_ID: ${{ github.run_id }}
        run: |
          python nba/team_confidence_diagnostic.py --prediction-dir nba/learning/predictions --history frontend/data/history.json --settled results/nba/settlement/postmortem.json --output results/nba/settlement/team_confidence_diagnostic.json
          mkdir -p nba/learning/team_confidence
          cp results/nba/settlement/team_confidence_diagnostic.json "nba/learning/team_confidence/run-${AUDIT_RUN_ID}.json"
          cp results/nba/settlement/team_confidence_diagnostic.json nba/learning/team_confidence/latest.json
          cat results/nba/settlement/team_confidence_diagnostic.json | python -c 'import json,sys; d=json.load(sys.stdin); m=d["minnesota_diagnostic"]; print("Scored games:",d["scored_games"],"Minnesota games:",m["games"],"Conclusion:",m["conclusion"],"Coefficients changed:",m["coefficients_changed"])' >> "$GITHUB_STEP_SUMMARY"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "nba/learning/team_confidence/run-${AUDIT_RUN_ID}.json" nba/learning/team_confidence/latest.json
          if ! git diff --cached --quiet; then git commit -m 'data(nba): archive team confidence diagnostic'; fi
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Fetch completed player participation for the frozen slate
        id: settled_fixtures
        if: ${{ hashFiles('results/nba/settlement/input/prospective/injury_status_observations.json') != '' }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          snapshot=json.loads(Path("results/nba/settlement/input/prospective/snapshot_module_freeze.json").read_text())
          settled=json.loads(Path("results/nba/settlement/postmortem.json").read_text())
          final_ids={str(row["game_id"]) for row in settled.get("games",[])}
          fixtures=[{key:row[key] for key in ("game_id","home_team","away_team","tipoff_utc")}
                    for row in snapshot.get("predictions",[]) if str(row["game_id"]) in final_ids]
          Path("results/nba/settlement/settled_fixtures.json").write_text(json.dumps(fixtures,indent=2))
          with open(os.environ["GITHUB_OUTPUT"],"a") as output:
              output.write("has_games="+("true" if fixtures else "false")+"\n")
          print("Completed fixtures with player boxscores:",len(fixtures))
          PY
      - name: Capture and validate observed +20 score trajectories once per settled slate
        if: ${{ steps.settled_fixtures.outputs.has_games == 'true' && hashFiles('results/nba/settlement/input/prospective/snapshot_module_freeze.json') != '' }}
        env:
          AUDIT_RUN_ID: ${{ github.run_id }}
        run: |
          python nba/plus20_trajectory.py --snapshot results/nba/settlement/input/prospective/snapshot_module_freeze.json --settled results/nba/settlement/postmortem.json --output results/nba/settlement/plus20_trajectory.json
          mkdir -p nba/learning/plus20_trajectory
          cp results/nba/settlement/plus20_trajectory.json "nba/learning/plus20_trajectory/run-${AUDIT_RUN_ID}.json"
          cp results/nba/settlement/plus20_trajectory.json nba/learning/plus20_trajectory/latest.json
          cat results/nba/settlement/plus20_trajectory.json | python -c 'import json,sys; d=json.load(sys.stdin); print("Verified score paths:",d["games_with_verified_score_path"],"unavailable:",d["games_unavailable"],"largest five:",d["five_largest_observed_advantages"])' >> "$GITHUB_STEP_SUMMARY"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "nba/learning/plus20_trajectory/run-${AUDIT_RUN_ID}.json" nba/learning/plus20_trajectory/latest.json
          if ! git diff --cached --quiet; then git commit -m 'data(nba): archive observed plus20 trajectories'; fi
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Fetch ESPN player boxscores for completed fixtures
        if: ${{ steps.settled_fixtures.outputs.has_games == 'true' }}
        run: |
          python nba/player_game_history.py --history results/nba/settlement/settled_fixtures.json --output results/nba/settlement/player_boxscores.json
      - name: Measure supporting-cast creation, shooting and defense proxies
        if: ${{ steps.settled_fixtures.outputs.has_games == 'true' && hashFiles('results/nba/settlement/input/prospective/snapshot_module_freeze.json') != '' && hashFiles('results/nba/settlement/input/prospective/pregame_module_context.json') != '' && hashFiles('results/nba/settlement/player_boxscores.json') != '' }}
        env:
          AUDIT_RUN_ID: ${{ github.run_id }}
        run: |
          python nba/supporting_cast_postmortem.py --snapshot results/nba/settlement/input/prospective/snapshot_module_freeze.json --module-context results/nba/settlement/input/prospective/pregame_module_context.json --settled results/nba/settlement/postmortem.json --boxscores results/nba/settlement/player_boxscores.json --output results/nba/settlement/supporting_cast_audit.json
          mkdir -p nba/learning/supporting_cast
          cp results/nba/settlement/supporting_cast_audit.json "nba/learning/supporting_cast/run-${AUDIT_RUN_ID}.json"
          cp results/nba/settlement/supporting_cast_audit.json nba/learning/supporting_cast/latest.json
          cat results/nba/settlement/supporting_cast_audit.json | python -c 'import json,sys; d=json.load(sys.stdin); print("Supporting-cast games:",d["settled_games"],"with both boxscores:",d["games_with_both_boxscores"],"probabilities changed:",d["model_probabilities_modified"])' >> "$GITHUB_STEP_SUMMARY"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "nba/learning/supporting_cast/run-${AUDIT_RUN_ID}.json" nba/learning/supporting_cast/latest.json
          if ! git diff --cached --quiet; then git commit -m 'data(nba): archive supporting cast postmortem'; fi
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Compare frozen injury and replacement scenarios with the full slate
        if: ${{ steps.settled_fixtures.outputs.has_games == 'true' && hashFiles('results/nba/settlement/input/prospective/snapshot_module_freeze.json') != '' && hashFiles('results/nba/settlement/input/prospective/injury_probability.json') != '' && hashFiles('results/nba/settlement/input/prospective/pregame_module_context.json') != '' && hashFiles('results/nba/settlement/player_boxscores.json') != '' }}
        env:
          SOURCE_RUN: ${{ env.PREGAME_RUN }}
        run: |
          python nba/injury_replacement_postmortem.py --snapshot results/nba/settlement/input/prospective/snapshot_module_freeze.json --injury results/nba/settlement/input/prospective/injury_probability.json --module-context results/nba/settlement/input/prospective/pregame_module_context.json --boxscores results/nba/settlement/player_boxscores.json --settled results/nba/settlement/postmortem.json --output results/nba/settlement/injury_replacement_audit.json
          mkdir -p nba/learning/injury_replacement/audits
          cp results/nba/settlement/injury_replacement_audit.json "nba/learning/injury_replacement/audits/run-${SOURCE_RUN}.json"
      - name: Preserve full-slate injury and replacement audit
        if: ${{ hashFiles('results/nba/settlement/injury_replacement_audit.json') != '' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "nba/learning/injury_replacement/audits/run-${PREGAME_RUN}.json"
          if ! git diff --cached --quiet; then git commit -m 'data(nba): archive full-slate injury replacement audit'; fi
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Join pregame injury states to actual player participation
        if: ${{ steps.settled_fixtures.outputs.has_games == 'true' && hashFiles('results/nba/settlement/input/prospective/injury_status_observations.json') != '' && hashFiles('results/nba/settlement/player_boxscores.json') != '' }}
        run: |
          python nba/injury_status_calibration.py settle --capture results/nba/settlement/input/prospective/injury_status_observations.json --boxscores results/nba/settlement/player_boxscores.json --output results/nba/settlement/injury_status_settlement.json
      - name: Preserve prospective injury status evidence and publish observed rates
        if: ${{ hashFiles('results/nba/settlement/injury_status_settlement.json') != '' }}
        env:
          SOURCE_RUN: ${{ env.PREGAME_RUN }}
        run: |
          mkdir -p nba/learning/injury_status/captures nba/learning/injury_status/settlements
          cp results/nba/settlement/input/prospective/injury_status_observations.json "nba/learning/injury_status/captures/run-${SOURCE_RUN}.json"
          cp results/nba/settlement/injury_status_settlement.json "nba/learning/injury_status/settlements/run-${SOURCE_RUN}.json"
          python nba/injury_status_calibration.py summarize --settlements nba/learning/injury_status/settlements --output frontend/data/nba-injury-status-calibration-latest.json
          python nba/injury_status_calibration.py attach --summary frontend/data/nba-injury-status-calibration-latest.json --publication frontend/data/nba-predictions-latest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "nba/learning/injury_status/captures/run-${SOURCE_RUN}.json" "nba/learning/injury_status/settlements/run-${SOURCE_RUN}.json" frontend/data/nba-injury-status-calibration-latest.json frontend/data/nba-predictions-latest.json
          if ! git diff --cached --quiet; then git commit -m 'data(nba): settle pregame injury status observations'; fi
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Preserve independent postmortem
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-postmortem-${{ github.run_id }}
          path: |
            results/nba/settlement/postmortem.json
            results/nba/settlement/injury_replacement_audit.json
            results/nba/settlement/team_confidence_diagnostic.json
            results/nba/settlement/supporting_cast_audit.json
            results/nba/settlement/plus20_trajectory.json
          retention-days: 90
